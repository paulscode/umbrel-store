version: "3.7"

services:
  # Opening this app opens the DATUM Gateway dashboard, which is what the official
  # Datum app does. It used to open a page this project wrote, carrying a
  # compatibility-report form, with the dashboard published raw on host port 7152
  # behind nothing at all. Both are gone: the dashboard is the app now, and it is
  # behind Umbrel's proxy like every other app's web interface.
  app_proxy:
    environment:
      APP_HOST: $APP_DATUM_BLAKE2B_GATEWAY_IP
      APP_PORT: 7152

  # The DATUM Gateway itself: turns the node's block templates into Stratum work
  # a Sia-style BLAKE2b ASIC can mine. Same image as the StartOS package.
  #
  # `entrypoint` and `command` override the image's own entrypoint deliberately,
  # and this is the one place the two platforms differ on purpose.
  #
  # That entrypoint regenerates datum_gateway_config.json from the environment on
  # every start, which is right on StartOS where the settings live in actions and
  # the config file is an output. Here the dashboard's own Config page is the only
  # settings form there is, so the config file has to be the thing that persists.
  # Running the gateway directly against a file the pre-start hook patches is
  # exactly what the official Umbrel Datum app does, and it is what lets
  # api.modify_conf be true.
  gateway:
    # PIN THIS BY DIGEST BEFORE RELEASING. Every other image in this store is
    # `<tag>@sha256:<digest>`; a tag alone can be moved, and Umbrel will happily
    # pull whatever it points at on a later install. The digest goes in once the
    # image is published, because it does not exist until then.
    image: paulscode/datum-blake2b:1.0.12@sha256:35945215fa213f1d95aeedf0a370913e7fc85e2bb2f42a20fed32830b32e2bc7
    entrypoint: ["/usr/local/bin/datum_gateway"]
    command: ["-c", "/app/conf/datum_gateway_config.json"]
    user: 1000:1000
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      # The config the dashboard reads and writes. Seeded from this app's `data`
      # directory and patched on every start by hooks/pre-start with the node's
      # RPC details and this app's Umbrel password.
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # Stratum, for the miner on your LAN. 23336 rather than the official Datum
      # app's 23334, so both can be installed on one server.
      - "23336:23336"
    networks:
      default:
        ipv4_address: $APP_DATUM_BLAKE2B_GATEWAY_IP
