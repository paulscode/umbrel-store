releaseNotes: >-
  The Obelisk SC1 Gen 2 can mine through this gateway now. Nothing changes for any other miner: what
  the gateway says to mining hardware when it connects is byte-for-byte what the previous release
  said, checked against the previous build running beside it.


  The SC1 Gen 2 has a 32-bit extranonce2 built into its firmware, where this gateway asks for 8
  bytes. It goes wrong two different ways depending on whether the firmware has been modified, and
  both are handled.


  If your SC1 runs patched firmware, there is nothing to set. That firmware sends 4 bytes of real
  value and 4 bytes of whatever was sitting next to it in memory, which used to make every share come
  back rejected as H-not-zero. The gateway now reads the share as sent first and, only if that fails,
  reads it again the way the miner actually calculated it. A miner whose shares already work never
  reaches the second attempt, so it cannot be affected.


  If your SC1 is stock, it refuses the work outright, and there is a new setting for it. Open the app,
  go to the Config tab, and set "Extranonce2 size" to "4 bytes". Leave it on 8 for anything else. This
  is not a per-miner setting: it changes what every miner on this gateway is told, so if you have
  other hardware pointed at it, check that it is still getting shares accepted afterwards. The gateway
  restarts when you change it, so your miners reconnect and pick up the new value.


  This has not been tested on real SC1 hardware. It was built from a detailed report by somebody who
  got one mining, and verified here against software written to match how that firmware behaves. That
  is why the setting is off by default. If you have one, whether it works or not is worth posting on
  the forum.


  Also fixed: saving the Config page could crash the gateway if the form arrived incomplete, which
  dropped every connected miner. And the block subsidy for the gateway's own empty work is now taken
  from the block template rather than recalculated; on Bitcoin the two are the same number, so nothing
  changes for you.
