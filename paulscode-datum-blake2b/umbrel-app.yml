releaseNotes: >-
  Replaces DATUM's built-in pool key with Convoy's, as well as filling in a missing one.


  1.1.4 seeded Convoy's key when the Pubkey box was empty. It left the box alone when it already held
  DATUM's own built-in key, which is the other way to end up unable to reach Convoy: that key is
  Ocean's, on the chain that kept SHA256d, and it arrives that way if a config is carried over from
  the official Datum app or if the key is copied out of DATUM's documentation. Either way it is never
  a usable answer on this chain, so it is now replaced too.


  A key you set yourself is still left alone, including one taken from Convoy, and any key Convoy
  rotates to in future.


  The symptom this fixes, if you are looking at it: Status reads "Non-Pooled Mode" with Collaborative
  reward sharing on "prefer", Pool Shares sit at zero while local shares climb, and Pool Tag shows
  your own gateway's tag where the pool's should be. That is the handshake failing on the wrong key,
  and the gateway quietly mining solo instead.
submitter: Paul Lamb
