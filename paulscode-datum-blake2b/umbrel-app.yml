releaseNotes: >-
  The app now tells you where to point your miner.


  Open the app and look at the top of the "Stratum Server Info" box on the status page. There is a new
  "Point Your Miner At" line showing the full address, including the port, already filled in with this
  device's IP address on your network. Copy that into your miner and you are done.


  This was the hardest part of setting the app up and there was nothing in the app that told you. The
  address is not the one in your browser's address bar: mining hardware almost never understands a name
  like umbrel.local, so it has to be the IP, and the port is 23336 rather than the usual 23334 so that
  this app and the original Datum app can both be installed at once. Now you do not have to know any of
  that.


  The address is looked up fresh each time the app starts, so it follows your device if your router
  hands it a different one.


  Nothing about your mining changes, and there is nothing to set.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
