releaseNotes: >-
  Pooled mining now puts the pool's whole payout list in the blocks your gateway
  finds. Every earlier version of this app put at most about 17 pool payouts in a
  block; everyone else in the pool's window was left out of that block and had to
  be paid later by the pool, as a make-good.


  The cause was a size limit meant for SHA256 mining hardware, which rebuilds the
  coinbase itself. The gateway applied a 750-byte limit to any miner it did not
  recognise, which is every BLAKE2b miner, and BLAKE2b miners never see the
  coinbase, so the limit protected nothing. The coinbase can now hold up to 1024
  payouts, sized to the room the block has left. At the node's default block size
  there is room for about 900, more than twice the payout list of the largest pool
  on this chain today.


  Also from upstream work by CONVOY, iohzrd and Lazarus Pool: a large coinbase in
  a nearly full block is now measured against the BLAKE2b header, so it cannot
  push the block over the weight limit; while pooled, the gateway no longer hands
  out work whose coinbase pays only the pool, which used to happen for a moment
  after each new block; and payouts are kept within the block's signature
  operation limit.


  The "Fingerprint and workaround known miner bugs" setting is gone from the
  Config page, because the gateway no longer has it. Your other settings are kept
  and you do not need to reconfigure your miners. Solo mining is unchanged.

