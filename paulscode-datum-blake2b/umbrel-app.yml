releaseNotes: >-
  Update Knots (BLAKE2b) Companion as well as this app. If you mine against a
  node that has not taken the chain's new coinbase maturity rule, the blocks you
  find will be rejected.


  The gateway takes its list of transactions straight from the node and does not
  check them, so this is not something it can protect you from. A node without
  the rule will offer transactions that stopped being valid at block 973440, and
  any block built from them is invalid. Update the node app to 1.1.9 or later,
  which is the first version carrying the rule.


  Nothing about how the gateway mines changes and you do not need to reconfigure
  your miners. This release also documents how long mined coins are locked,
  which the setup notes did not say at all: the wait used to be 100 blocks,
  about 16 hours, and is now 6480 blocks, roughly 45 days at a ten minute block
  target, applying to coins already mined as well as new ones. Nothing is lost,
  but a first block arriving and then sitting unspendable is expected rather
  than a fault.

