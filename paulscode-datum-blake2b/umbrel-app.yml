releaseNotes: >-
  Opening this app now opens the DATUM Gateway dashboard, the same way the official Datum app does.
  It used to open a page this project wrote, carrying a compatibility-report form, with the
  dashboard published separately on port 7152 behind nothing at all. The dashboard is the app now,
  and it sits behind umbrelOS's proxy like every other app's web interface.


  YOU CAN CHANGE SETTINGS IN THE APP. The Config tab is live: your payout address, coinbase tags,
  stratum and vardiff settings, logging, all of it, and changes survive a restart. Sign in with
  the username `admin` and the password from "Show default credentials" on the app icon's context
  menu. Previously the dashboard's admin pages, including the page listing your connected miners,
  were unreachable because no password was ever set.


  SET YOUR PAYOUT ADDRESS AFTER UPDATING. Earlier versions asked your node for an address and used
  the first one it gave. That is no longer done, because it quietly put your block rewards in a
  wallet whose backup nobody had thought about. The Config tab asks for one instead, which is what
  the official app does.


  The compatibility report is gone: the second Stratum port on 23337 that recorded a miner's
  conversation, and the form that turned a recording into a report. It existed to find out which
  Sia ASICs could talk to this gateway when nobody knew. Five models across three manufacturers
  are now known to work. If your miner was pointed at 23337, point it at 23336 instead.


  The private test chain is gone with it, along with the network selector on the old page. Mining
  now means mining the BLAKE2b chain on mainnet.


  Primary Coinbase Tag now works. It has been a setting that did nothing since it was added,
  discarded on the way to the gateway by a rule that existed to protect the fork's activation
  block. That block was mined on 30 August 2026, so there is nothing left to protect.
submitter: Paul Lamb
