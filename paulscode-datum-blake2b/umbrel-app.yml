manifestVersion: 1.1
id: paulscode-datum-blake2b
category: bitcoin
name: Datum (BLAKE2b) Companion
version: "1.1.5"
tagline: Solo mine the BLAKE2b chain with a Sia-style ASIC you already own
description: >-
  ⚙️ Please read the important setup instructions at the bottom of this page.


  Solo mine the BLAKE2b chain with a Sia-style ASIC. Bitcoin's mainnet split on
  30 August 2026, and from block 961640 one of the two chains uses BLAKE2b for
  proof of work instead of SHA256d. BLAKE2b is the algorithm Sia mines, so the
  ASICs built for Sia can mine that chain. This app lets you point yours at it.


  It runs the DATUM Gateway built against the BLAKE2b branch. It takes block
  templates from your **Knots (BLAKE2b) Companion** node, turns them into
  Stratum work in the dialect Sia miners speak, and hands that out on your LAN.


  Both sides of the 2026 split claim to be Bitcoin. Which one you mine is your
  decision, and pointing hashrate at this makes it.


  🛠️ SET-UP INSTRUCTIONS


  ### Bitcoin node


  This app connects automatically to your Knots (BLAKE2b) Companion app on
  install. A full archival node is not needed for mining, and that app is pruned
  by default.


  ### Configuring the gateway


  Open this app and set your Bitcoin address under the **Config** tab. That is
  the address your mining rewards are paid to, and nothing is mined until it is
  set. It should be an address whose keys you hold: solo mining means a block you
  find pays its whole subsidy there.


  The credentials for changing settings are on your umbrelOS home screen:
  right-click the app icon and choose "Show default credentials". The username is
  `admin`.


  ### Mining solo or to a pool


  Out of the box this mines solo: a block you find pays its whole subsidy to your
  address, and nothing is shared.


  To mine to a pool instead, open the **Config** tab and change **Collaborative
  reward sharing** from "never" to "prefer" or "require". The Host, Port and
  Pubkey boxes under **Pool** stay greyed out until you do, because DATUM's
  dashboard disables them while reward sharing is off. That is the step people
  miss.


  Then fill in **Host** and **Port**. Convoy is the pool for this chain:

    - Host: `datum-beta1.mine.convoy.xyz`

    - Port: `28915`


  **Pubkey** is already filled in with Convoy's, so a host and a port are all you
  need to add. It should read:


  `dbb11fa0c2b5403e4f798fa6071bb97e6079d219598366032fdf2ae01962b13c5e66e2be7d6b008f0b2603f3e6f6fc64768fa786c8129c46d3e30a5867734b62`


  That key is what authenticates the pool to you, so it is worth checking against
  the one Convoy publishes rather than taking it from here. If Convoy ever changes
  it, paste the new one into that box. It is always 128 hex characters, a signing
  key and an encryption key one after the other, and a key of any other length
  stops the gateway from starting.


  Before you change any of this, the Host box shows
  `datum-beta1.mine.ocean.xyz`. That is DATUM's own built-in default, shown
  whenever no pool is set, and it belongs to a pool on the chain that kept
  SHA256d. This app never contacts it. The logs say so on every start: "DATUM
  pool host is blank. NON-POOLED MINING!".


  ### Connecting your miner


  In your miner's own web interface, set the pool to your server's IP address on
  port 23336:

    - Stratum URL: `stratum+tcp://192.168.1.50:23336`

    - Username/Worker: anything readable, so you can tell miners apart. It is not
    used for payment.

    - Password: leave blank, or use `d=1024` to ask for a starting share
    difficulty if you are renting hashrate.


  **Use your server's IP address, not a `.local` name.** Most ASIC firmware has
  no mDNS resolver, so a `.local` address fails silently and the miner just
  reports that the pool is not ready.


  ### Which miners work


  Verified on stock firmware: Goldshell HS-Box, Goldshell SC5 Pro, Goldshell SC
  Box II, Bitmain Antminer A3 on CGminer, and Innosilicon S11. Other Sia BLAKE2b
  miners are expected to work but have not been tried.


  Port 23336 is used rather than the official Datum app's 23334, so both apps can
  be installed on one server.
