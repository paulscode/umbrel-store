releaseNotes: >-
  Fills in Convoy's pool public key, which 1.1.3 wrongly told you to leave alone.


  DATUM has a pool key compiled in and uses it whenever the config names none. That key belongs to a
  pool on the chain that kept SHA256d, so on this chain it is never the right answer: a gateway given
  Convoy's host and port and nothing else would offer the wrong key, and the connection would fail
  with nothing on the dashboard to say why. 1.1.3's instructions said to leave the box empty. That
  was wrong, and this corrects it.


  Convoy's key is now seeded into the config, so its host and port are all you need to enter. The key
  is shown in the Pubkey box on the Config tab, and it is worth checking against the one Convoy
  publishes, since that key is what authenticates the pool to you. A key you have already entered
  yourself is left alone, and if Convoy ever changes it, the new one goes in that box.


  Everything 1.1.3 added is still here: the Pool boxes stay greyed out until "Collaborative reward
  sharing" is changed from "never", which is the step people miss, and a key of the wrong length is
  caught before it reaches the gateway instead of crash-looping the app out of reach of its own
  dashboard.
submitter: Paul Lamb
