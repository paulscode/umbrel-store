releaseNotes: >-
  Hardens the difficulty request added in 1.0.10, from a review done while preparing the change to
  send upstream. Three things came out of it.


  The password was read on every authorize, and a miner may send that more than once on one
  connection. Since a changed difficulty sends fresh work, a miner alternating between two values
  could make the gateway build and send a full job per request, where it used to reply with a small
  acknowledgement. It is now read once per connection. This is the one worth updating for if you point
  rented hashrate at this gateway, because the miners doing so are not yours.


  A request is now bounded. The number was parsed in a way that saturates rather than failing, so a
  long enough run of digits arrived as the largest 64-bit value and went into the difficulty and share
  target maths unchecked. Requests beyond anything usable are ignored rather than clamped, because the
  request is a floor and a value too high for the miner cannot be walked back down.


  Setting the new client difficulty floor to 0 reached an undefined shift before the check that
  rejects it. It is now rejected first, with a clear message.


  No miner that was working is affected, and nothing about how a request is honoured has changed.
