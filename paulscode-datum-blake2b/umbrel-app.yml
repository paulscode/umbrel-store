releaseNotes: >-
  Lets a miner ask for the share difficulty it should run at, by putting it in the Stratum password.
  Send "d=8192" and the gateway starts that miner there and holds it as a floor; send "fd=8192" and it
  holds exactly there and does not vary it. Anything the gateway does not recognise is ignored, so the
  "x" that almost every miner sends means what it always did and no existing miner changes difficulty
  when you update.


  This exists because the password is often the only field an operator can set. Rental marketplaces
  and some firmware let you configure a pool host, port, worker name and password and nothing else,
  with no way to make the miner negotiate difficulty through the protocol itself. A small miner left
  on a difficulty meant for a large one produces very few shares, which is what makes rented hashrate
  look like it is underdelivering when it is not.


  The request sets a floor and not merely a starting point, because difficulty is adjusted downward by
  halving with a clamp, and setting only the starting value would be undone at the first adjustment.


  A request cannot lower difficulty past the limits that are not preferences: a new
  "stratum.vardiff_client_min" setting, below which no miner may ask, the compatibility floor of a
  miner recognised as needing one, and the minimum the pool itself declares when mining pooled.
