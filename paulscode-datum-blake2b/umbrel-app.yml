releaseNotes: >-
  Fixes the app failing to open, with the gateway restarting in a loop and logging "unable to open
  /app/conf/datum_gateway_config.json".


  Its configuration file is shipped with the app and copied on a fresh install, but umbrelOS does not
  copy that part of an app when it updates one. An install that updated into the version which first
  needed the file never received it, Docker created an empty directory where it should have been, and
  the gateway could not start.


  The file is now written from its defaults whenever it is missing, so an affected install repairs
  itself on the next start. Nothing is overwritten if it is already there: a payout address or any
  other setting changed in the dashboard is left alone.


  Also fixes "Error writing new config file (changes will be lost at restart)" when saving on the
  Config tab. The gateway saves by writing a temporary file next to its config, which needs write
  access to the folder holding it, and that folder was owned by root. Settings saved before this
  update were genuinely discarded, so re-enter anything you changed and it will stick.

submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
