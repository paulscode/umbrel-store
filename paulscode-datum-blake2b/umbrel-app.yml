id: paulscode-datum-blake2b
category: bitcoin
name: Datum (BLAKE2b) Companion
version: "1.0.11"
tagline: Solo mine the BLAKE2b chain with a Sia-style ASIC you already own
description: >-
  Solo mine the BLAKE2b chain with a Sia-style ASIC. Bitcoin's mainnet split on
  30 August 2026, and from block 961640 one of the two chains uses BLAKE2b for
  proof of work instead of SHA256d. BLAKE2b is the algorithm Sia mines, so the
  ASICs built for Sia can mine that chain. This app lets you point yours at it.


  It runs the DATUM Gateway built against the BLAKE2b branch. It takes block
  templates from your **Knots (BLAKE2b) Companion** node, turns them into
  Stratum work in the dialect Sia miners speak, and hands that out on your LAN.


  SET YOUR PAYOUT ADDRESS BEFORE YOU MINE


  This is not a test chain, and that is a change from earlier versions of this
  app. Solo mining means a block you find pays its whole subsidy to the address
  configured here, so that address should be one whose keys you hold. Set it on
  the settings page. The app can ask the node for one, but a wallet on the node
  is only as safe as your backups of it.


  Both sides of the 2026 split claim to be Bitcoin. Which one you mine is your
  decision, and pointing hashrate at this makes it.


  HOW TO USE IT


  1. Install **Knots (BLAKE2b) Companion** first and let it sync.
  2. Install this, open it, and set your payout address.

  3. In your miner's own web interface, set the pool to the Stratum address the
     page shows you. The worker name and password are not used.

  4. Watch the dashboard.


  Use your server's IP address, not a `.local` name. Most ASIC firmware has no
  mDNS resolver, so a `.local` address fails silently and the miner just reports
  that the pool is not ready.


  REPORTING YOUR HARDWARE


  Verified so far, both on stock firmware with no changes: the Goldshell HS-Box
  in Sia mode, tested directly, and a Bitmain Antminer A3 on CGminer 4.9.0
  reported by a user, which had 158 of 161 shares accepted over a two-hour
  session. They share no manufacturer and no firmware lineage and spoke to the
  gateway identically. Other Sia BLAKE2b miners are expected to work but have
  not been tried.


  If yours is not on that list, this app can record how it talks to the gateway
  and turn that into a short report you can share, so the upstream projects can
  make BLAKE2b mining work on more hardware. Point the miner at the capture port
  for a minute, fill in the form, and copy what it gives you. Nothing is sent
  anywhere on its own, worker names are hashed and passwords are dropped before
  anything reaches disk, and you see exactly what you are sharing.


  PORTS


  Stratum on 23336 and the compatibility-test port on 23337, chosen so this can
  sit alongside the official Datum app, which keeps 23334.
