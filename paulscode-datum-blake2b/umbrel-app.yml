releaseNotes: >-
  Explains how to mine to a pool, and stops one wrong value there from taking the app down.


  The Pool boxes on the Config tab are greyed out until "Collaborative reward sharing" is changed
  from "never" to "prefer" or "require". That is DATUM's dashboard disabling them, not a fault, but
  nothing said so, and the Host box meanwhile shows an address belonging to a pool on the chain that
  kept SHA256d. It is DATUM's built-in default, shown whenever no pool is set, and this app has never
  contacted it. The setup instructions on this page now cover both.


  Convoy's host and port are named in the instructions, and the Pubkey box is best left empty: DATUM
  has a pool key built in and uses it whenever that box is unset, which is why a host and a port are
  all a pool usually asks for.


  If you do fill it in, it has to be exactly 128 hex characters, a signing key and an encryption key
  one after the other. Anything else was fatal at startup rather than a validation error, and because
  the dashboard is served by the process that died, the app would crash-loop with no way left to
  correct the value. A key of the wrong length is now caught before the gateway sees it: pooled
  mining is turned off for that start so the dashboard comes back, the host is remembered, and the
  app log says what to fix. An empty box is left alone, so nothing changes for anyone who never
  touched it.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
