    type: "three-stats"
    refresh: "30s"
    endpoint: "gateway:7152/umbrel-api"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Connections"
          text: "2"
          subtext: "Worker"
        - title: "Hashrate"
          text: "1.8"
          subtext: "TH/s"
