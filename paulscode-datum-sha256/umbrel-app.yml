releaseNotes: >-
  Fixes a fault that could start rejecting your shares after several hours of mining.


  The gateway keeps a list of the shares it has already seen, so it can spot one that arrives twice. The
  first time that list filled up it lost track of itself, and from then on it could refuse perfectly good
  shares. Restarting the app was the only thing that cleared it. How long it took to get there depended on
  how busy your miners were, so a few hours was typical. If your reject rate has ever climbed out of
  nowhere and then gone back to normal after you restarted, this is very likely why.


  The app now also tells you why shares were refused, rather than only how many. On the status page, under
  "Local Shares Rejected", there is a new "Rejected Because" line listing what has actually happened, most
  common first. It reads "None" when there is nothing to report. The Clients page has a new "Last Reject"
  column, so when only one of your miners is misbehaving you can see which one it is.


  Those reasons use the same words your mining hardware writes in its own log, so you can read the two
  side by side.


  Behind the scenes this app now pulls its own image rather than sharing one with the BLAKE2b companion,
  which has moved to a different codebase. Nothing about your settings changes, your miners do not need
  reconfiguring, and this is an ordinary update to the app you already have installed.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
