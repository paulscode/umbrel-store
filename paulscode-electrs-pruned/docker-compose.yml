version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_ELECTRS_PRUNED_WEB_IP
      APP_PORT: 80

  # Small static page shown by the app's "Open" button: how to connect a wallet.
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      # Served from the image's own writable layer, because the poller below
      # writes status.json next to the page and the app's files stay read-only.
      - ${APP_DATA_DIR}/web:/srv/web:ro
      # Read-only, and only for the cookie, when the chosen node authenticates
      # that way. Needed because the indexing percentage is measured against the
      # node's own height, which means asking the node.
      - ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro
    environment:
      NODE_RPC: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}/
      # Empty when the node authenticates by cookie, which is the signal to probe
      # for one. Same split as the proxy and the electrs entrypoint.
      NODE_USER: ${APP_BITCOIN_RPC_USER}
      NODE_PASS: ${APP_BITCOIN_RPC_PASS}
      ELECTRS_METRICS: http://${APP_ELECTRS_PRUNED_SERVER_IP}:4224/metrics
    # Two sources, because neither alone is a percentage: electrs publishes how
    # far it has indexed, and only the node knows how far there is to go.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp -R /srv/web/. /usr/share/nginx/html/
        STATUS=/usr/share/nginx/html/status.json
        printf '{"node":null,"indexed":null,"at":0}' > "$$STATUS"
        (
          while true; do
            AUTH=""
            if [ -n "$${NODE_USER:-}" ]; then
              AUTH=$$(printf '%s:%s' "$$NODE_USER" "$$NODE_PASS" | base64 | tr -d '\n')
            else
              for sub in regtest testnet4 testnet signet ""; do
                if [ -n "$$sub" ]; then C="/bitcoin/$$sub/.cookie"; else C="/bitcoin/.cookie"; fi
                # Re-read every poll, so a node restart that rewrites it is picked up.
                if [ -r "$$C" ]; then AUTH=$$(tr -d '\r\n' < "$$C" | base64 | tr -d '\n'); break; fi
              done
            fi
            NODE=null
            if [ -n "$$AUTH" ]; then
              R=$$(wget -q -O - -T 10 \
                    --header "Authorization: Basic $$AUTH" \
                    --header "Content-Type: text/plain" \
                    --post-data '{"jsonrpc":"1.0","id":"s","method":"getblockchaininfo","params":[]}' \
                    "$$NODE_RPC" 2>/dev/null) || R=""
              case "$$R" in '{'*) NODE="$$R" ;; esac
            fi
            # electrs sets this gauge for each block as it indexes it, so it moves
            # during the build rather than only at the end.
            IDX=$$(wget -q -O - -T 10 "$$ELECTRS_METRICS" 2>/dev/null \
                   | awk '$$1 == "electrs_index_height{type=\"tip\"}" {print $$2}' | tail -1) || IDX=""
            case "$$IDX" in ''|*[!0-9.eE+-]*) IDX=null ;; esac
            printf '{"node":%s,"indexed":%s,"at":%s}\n' "$$NODE" "$$IDX" "$$(date +%s)" > "$$STATUS.tmp"
            mv "$$STATUS.tmp" "$$STATUS"
            sleep 10
          done
        ) &
        exec nginx -g 'daemon off;'
    networks:
      default:
        ipv4_address: $APP_ELECTRS_PRUNED_WEB_IP

  # btc-rpc-proxy sits between electrs and the Bitcoin Node, and is the whole
  # reason this app can index a pruned node. electrs asks for blocks below the
  # prune height with `getblock <hash> 0`; bitcoind no longer has them, and the
  # proxy fetches them from the p2p network and verifies them against the node.
  #
  # On StartOS the bitcoind package runs this itself whenever pruning is enabled,
  # so its dependents get it transparently. Umbrel has no equivalent, so the app
  # brings its own.
  #
  # The image expects a config at a fixed path and has no environment interface,
  # so the config is written at start from the variables Umbrel injects. umask
  # 077 because it carries the RPC password, and the image's own entrypoint
  # chmods 600 for the same reason.
  #
  # passthrough_rpcauth points at the node's bitcoin.conf, which carries an
  # `rpcauth=umbrel:<salt>$<hash>` line. That makes the proxy accept exactly the
  # credentials the node accepts, so electrs authenticates with the same user and
  # password whether it is pointed at the node or at the proxy. It also means no
  # second secret is generated, stored or shared by this app.
  proxy:
    # Our build of v0.8.0, carrying PR #33. Stock v0.8.0 cannot parse a 164-byte
    # BLAKE2b header, and it parses the block for any request it intercepts, so
    # every verbose `getblock` and every intercepted `getrawtransaction` above
    # block 961640 came back "IO error: failed to fill whole buffer". That is
    # Mempool Pruned's entire block path and this app's own verbose transaction
    # lookups. Not a pruning problem: it failed on blocks the node still had.
    # Swap back to ghcr.io/start9labs/btc-rpc-proxy once #33 is merged upstream.
    image: paulscode/btc-rpc-proxy:v0.8.0-blake2b.1@sha256:84f236b9d8ad87b5dced11ce1e85bab33d7b51e64b4dc0f86e79ab1746a56bfc
    restart: on-failure
    environment:
      BITCOIND_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIND_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIND_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIND_PASS: ${APP_BITCOIN_RPC_PASS}
    volumes:
      - ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        umask 077
        # The user and password come from the Bitcoin Node app and are not ours
        # to constrain, so escape them for a TOML basic string rather than
        # assume they are alphanumeric. An unescaped quote in the password ends
        # the string early and the proxy reads a config that is not the one
        # meant. Compose substitutes $VAR from the host, so container variables
        # are written $$VAR to survive to the shell.
        esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
        H=$$(esc "$${BITCOIND_HOST}")
        U=$$(esc "$${BITCOIND_USER}")
        P=$$(esc "$${BITCOIND_PASS}")
        # How the chosen node authenticates, which differs between them and is not a
        # setting: the official Bitcoin Node uses rpcauth and exports a user and password,
        # while the BLAKE2b companion uses the cookie it writes itself. An empty user is
        # the signal for the second, and the cookie is located by probing the chain
        # subdirectories bitcoind uses for anything but mainnet, exactly as the electrs
        # entrypoint does.
        if [ -n "$${BITCOIND_USER}" ]; then
          AUTH=$$(printf 'bitcoind_user = "%s"\nbitcoind_password = "%s"\npassthrough_rpcauth = "/bitcoin/bitcoin.conf"' "$$U" "$$P")
        else
          COOKIE=""
          for sub in regtest testnet4 testnet signet ""; do
            if [ -n "$$sub" ]; then C="/bitcoin/$$sub/.cookie"; else C="/bitcoin/.cookie"; fi
            if [ -r "$$C" ]; then COOKIE="$$C"; break; fi
          done
          if [ -z "$$COOKIE" ]; then
            echo "proxy: no readable .cookie under /bitcoin; is the chosen node running?" >&2
            exit 1
          fi
          echo "proxy: authenticating to the node with $$COOKIE"
          AUTH=$$(printf 'cookie_file = "%s"\npassthrough_rpccookie = "%s"' "$$COOKIE" "$$COOKIE")
        fi
        cat > /tmp/btc_rpc_proxy.toml <<EOF
        bitcoind_address = "$$H"
        bitcoind_port = $${BITCOIND_PORT}
        $$AUTH
        bind_address = "0.0.0.0"
        bind_port = 8332
        # Users derived from passthrough carry no fetch_blocks of their own, so
        # this global switch is what grants them on-demand fetching of pruned
        # blocks. Without it the proxy forwards every getblock straight to
        # bitcoind and a pruned block still fails.
        default_fetch_blocks = true
        # Unset, the proxy asks every eligible peer for the same block at once
        # and keeps the first valid answer, which is N copies of every fetch.
        max_peer_concurrency = 3
        # A verbose transaction lookup fetches the same block twice by itself,
        # so the repeat should not go back to the network.
        block_cache_size_mib = 64
        EOF
        exec /usr/bin/btc_rpc_proxy --conf /tmp/btc_rpc_proxy.toml
    networks:
      default:
        ipv4_address: $APP_ELECTRS_PRUNED_PROXY_IP

  # electrs, patched to index from a pruned node and to follow a chain whose
  # block headers are not all 80 bytes. Same image as the StartOS package; the
  # entrypoint builds electrs.toml from these variables because Umbrel has no
  # settings form.
  #
  # daemon_rpc_addr points at the proxy, not the node, so pruned blocks resolve.
  # daemon_p2p_addr points at the node directly, because that path only carries
  # blocks the node still has and gains nothing from the detour.
  server:
    image: paulscode/electrs-pruned:0.11.2@sha256:48ee6a0a869c6181d490e0866ba9918ba78cf643e0b9e2b0519b2a59d06c6ddd
    restart: always
    stop_grace_period: 5m
    depends_on:
      - proxy
    environment:
      ELECTRS_CONFIG_FROM_ENV: "1"
      BITCOIN_RPC_HOST: ${APP_ELECTRS_PRUNED_PROXY_IP}
      BITCOIN_RPC_PORT: "8332"
      BITCOIN_P2P_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIN_P2P_PORT: ${APP_ELECTRS_PRUNED_BACKEND_P2P_PORT}
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      # Empty above when the chosen node authenticates with a cookie instead; the
      # entrypoint then falls through to this directory, probing it for the cookie and
      # taking the chain from where it finds it.
      BITCOIN_COOKIE_DIR: /backend
      ELECTRS_NETWORK: ${APP_BITCOIN_NETWORK_ELECTRS:-bitcoin}
      ELECTRS_LOG_FILTERS: INFO

      # Prometheus metrics, which is where the connect page reads indexing
      # progress from. electrs binds this to 127.0.0.1 by default, which is
      # container-local and so unreachable from the page's container.
      #
      # Read by electrs itself rather than by the entrypoint: electrs uses
      # configure_me with env_prefix "ELECTRS", so every setting has an
      # ELECTRS_-prefixed variable and this one needs no config file entry.
      # Internal to the app's network and never published to the host.
      ELECTRS_MONITORING_ADDR: 0.0.0.0:4224

      # An archival node to read pruned blocks from, when one is installed.
      #
      # Every block below the 2026 chain split is identical on both sides, so a full node of
      # either chain already holds almost everything a pruned node has discarded. Reading those
      # from its disk is far cheaper than fetching them from the network one at a time, which
      # is what this app otherwise does for the whole history below the prune height.
      #
      # Knots (BLAKE2b) Companion is the candidate, being the second node this store expects
      # alongside the official one. It is not a dependency: uninstalled, these expand to
      # nothing and no helper is configured, which is the ordinary single-node case.
      #
      # Installed is not sufficient. It also has to be archival and synced far enough, which
      # electrs checks against the node itself and reports in its log if it declines. That app
      # keeps only recent blocks by default, so it must be set to keep the whole chain first.
      #
      # Harmless when that app is also the node being indexed: electrs finds the helper is the
      # same pruned node it is already asking, declines it for being pruned, and carries on.
      HELPER_RPC_HOST: ${APP_KNOTS_BLAKE2B_NODE_IP:-}
      HELPER_RPC_PORT: ${APP_KNOTS_BLAKE2B_RPC_PORT:-}
      HELPER_COOKIE_DIR: /helper
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_BITCOIN_DATA_DIR}:/backend:ro
      # Read-only, and only for the cookie. Absent when that app is not installed, in which
      # case the cookie probe finds nothing and the helper is skipped.
      - ${UMBREL_ROOT}/app-data/paulscode-knots-blake2b/data:/helper:ro
    ports:
      # Published on 50201, not 50001. This app is built to run *alongside* the
      # official Electrs app, not instead of it: the intended setup is one
      # archival node with the official Electrs on 50001 and one pruned node
      # with this on 50201, so both chains are reachable from one server.
      # electrs-liquid in this store took 50101 for the same reason.
      - "50201:50001"
    networks:
      default:
        ipv4_address: $APP_ELECTRS_PRUNED_SERVER_IP
