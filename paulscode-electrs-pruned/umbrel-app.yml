releaseNotes: >-
  Keeps indexing the BLAKE2b chain when Knots (BLAKE2b) moves to Bitcoin Knots
  29.4.3. That release stops serving blocks past the chain split to any peer
  that does not say it follows the BLAKE2b chain. This server did not say so, so
  it stopped at the last block it had while still answering wallets. It now says
  so whenever its node does. Update this app before updating Knots (BLAKE2b).


  IF YOU ARE UPDATING FROM 0.11.15 OR EARLIER, 0.11.16 also applies:


  Fixes a server that stays at "Starting up" and never indexes, with
  "unexpected HTTP code: 401" in its log, when it starts at the same time as
  the Bitcoin node, as on a reboot or an update.


  The proxy in front of Bitcoin decides at startup which credentials to accept.
  If it started before the node had written its login cookie, it never accepted
  that cookie, and the server, which logs in with it, was refused on every
  attempt until the proxy itself was restarted. The proxy now waits for the
  cookie before starting.


  If your server is in that state, this update fixes it. Nothing changes for an
  existing index.

