manifestVersion: 1.1
id: paulscode-electrs-pruned
category: bitcoin
name: Electrs Pruned
version: "0.11.9"
tagline: A second Electrum server, for your pruned node
description: >-
  Runs alongside the official Electrs app rather than replacing it. The intended
  setup is two nodes on one server: an archival node with the official Electrs on
  port 50001, and a pruned node with this on port 50201. Both chains stay
  reachable from your own hardware without paying for the disk to hold two full
  blockchains.


  The official Electrs app requires an archival node with transaction indexing,
  which means keeping the whole chain. This one does not: it indexes from a
  pruned node and fetches the blocks your node has dropped from the peer-to-peer
  network, verifying each one against your node before using it.


  Your wallets query balances, transaction history and broadcast transactions
  through your own node instead of somebody else's server.


  HOW IT WORKS


  The app runs two containers. The indexer is electrs, patched to route requests
  for old blocks past the point where your node stopped keeping them. Alongside
  it runs btc-rpc-proxy, which fetches those blocks over peer-to-peer and checks
  them against your node, so nothing is trusted that your node has not confirmed.


  Nothing is changed on your Bitcoin Node, and an archival node works too: the
  routing only engages below the prune height, so if there is no prune height it
  never engages.


  WHAT TO EXPECT


  A pruned node saves disk on blocks, but the address index is separate and still
  has to be built and stored. Expect roughly 60 to 80 GB for the index on mainnet
  and a first sync measured in hours. Fetching a dropped block costs a network
  round trip, so a wallet asking about very old transactions is slower than it
  would be against an archival node. Recent history is unaffected.


  PRIVACY


  Blocks your node has dropped are fetched from the Bitcoin network, and a peer
  that serves you a block learns you wanted it. During the first index that only
  shows you are syncing. Afterwards a few requests can still reach for a block on
  demand, such as the full details of an old transaction, and those follow from
  something you asked for.


  Ordinary wallet use does not fetch anything: balances, history and unspent
  outputs come from the index this app builds, so your addresses never go to a
  peer. If your Bitcoin Node runs over Tor, these fetches do too, which is slower
  but does not reveal where the request came from.


  An archival node with the official Electrs stores the whole chain and so never
  fetches at all. That is the more private option, and it is the right one if this
  tradeoff is not one you want.


  CONNECTING


  - Other Umbrel apps: depend on this app and read APP_ELECTRS_PRUNED_SERVER_IP
    and APP_ELECTRS_PRUNED_SERVER_PORT (internal Electrum port 50001).

  - Wallets on your LAN: point an Electrum-compatible wallet at your Umbrel's
    address on port 50201. The official Electrs app keeps 50001, so both can be
    installed and both can be connected to at once.
