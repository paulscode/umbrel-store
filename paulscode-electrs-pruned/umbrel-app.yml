gallery:
  - https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-electrs-pruned/gallery/1.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Moves off port 3031, which the official AnythingLLM app also uses. Umbrel gives each app its
  own port and refuses to install one whose port is already taken, so anyone running that app
  could not install this one, and the failure said only that the port was allocated.


  If you already have this installed, the address you use to open it changes from 3031 to 3034.
  Nothing else changes, and your index is untouched.
