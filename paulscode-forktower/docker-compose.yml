version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_FORKTOWER_IP
      APP_PORT: 8330

  # One container: the daemon plus the second Bitcoin node, supervised by
  # s6-overlay. The same image the compose reference and the StartOS package
  # use — what is tested in one is tested in all of them.
  web:
    # Pinned by digest, which is what a released version must be: umbreld pulls
    # every image in this file on install and on update, and re-checks a tag
    # against the registry each time — so a moving tag gives a user whatever it
    # points at today rather than the bits that were tested.
    #
    # **The digest is the index's, not a platform's.** A multi-architecture tag
    # is an index listing one image per platform, and `docker manifest inspect`
    # shows the per-platform digests prominently — they are the easiest thing to
    # copy and the wrong thing to pin, because pinning one serves that
    # architecture and leaves everybody else unable to install. For this project
    # that means the Raspberry Pi users. `make umbrel-pin` reads the index
    # digest and refuses a tag that is a single image or missing an
    # architecture.
    image: paulscode/forktower:v0.6.10@sha256:967cfafb830ce8dbfe4268a01cd5a465f9a51e1585b3dbecbbc85c79c402d16b
    # The image's default entrypoint is the shared renderer, which is what the
    # compose reference deployment wants. Umbrel needs the translation step in
    # front of it — two Bitcoin apps with two variable prefixes — so it is named
    # here. Without this the container starts, finds no FORKTOWER_SF_RPC_URL,
    # and asks the user to set a variable no Umbrel user has ever heard of.
    entrypoint: /usr/local/bin/docker_entrypoint_umbrel.sh
    restart: on-failure
    # A Bitcoin node asked to stop mid-write needs time to finish. Killing it
    # early is how a datadir comes back needing a reindex.
    stop_grace_period: 5m
    volumes:
      # Forktower's own data: its database, its configuration, and the second
      # Bitcoin node's datadir under sq/.
      - ${APP_DATA_DIR}/data:/data
      # The Lightning credentials, as two individual read-only files.
      #
      # **Not the data directory**, which is what the neighbouring apps mount.
      # The read-only macaroon is the one LND wrote itself at wallet creation and
      # it answers everything Forktower asks; the data directory contains rather
      # more than that, and a mount is not something a careful credential policy
      # can take back afterwards.
      #
      # /dev/null when no Lightning node is installed — the file is then empty,
      # which the entrypoint reads as "no node" and carries on. Forktower watches
      # both chains perfectly well without one.
      - ${APP_FORKTOWER_LND_CERT:-/dev/null}:/mnt/lnd/tls.cert:ro
      - ${APP_FORKTOWER_LND_MACAROON:-/dev/null}:/mnt/lnd/readonly.macaroon:ro
    environment:
      # Declared, never guessed. The guess decides which "how to turn on your
      # watchtower client" instructions the dashboard shows, and the three
      # platforms have three different answers — naming a control that is not on
      # the user's screen is worse than saying nothing.
      FORKTOWER_PLATFORM: umbrel

      # ── The user's own Bitcoin node ──
      #
      # Both flavours are passed and the entrypoint picks whichever exists. The
      # official Bitcoin Node app exports APP_BITCOIN_*; Bitcoin Knots exports
      # APP_BITCOIN_KNOTS_*. Requiring one in umbrel-app.yml would exclude the
      # other, and both are real audiences: a Knots user is enforcing the new
      # rules whether or not they chose to, and a Core user is on the status-quo
      # side and equally wants to see the chain they are blind to.
      UMBREL_KNOTS_IP: ${APP_BITCOIN_KNOTS_NODE_IP:-}
      UMBREL_KNOTS_RPC_PORT: ${APP_BITCOIN_KNOTS_RPC_PORT:-}
      UMBREL_KNOTS_RPC_USER: ${APP_BITCOIN_KNOTS_RPC_USER:-}
      UMBREL_KNOTS_RPC_PASS: ${APP_BITCOIN_KNOTS_RPC_PASS:-}
      UMBREL_KNOTS_ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_KNOTS_ZMQ_RAWBLOCK_PORT:-}
      UMBREL_KNOTS_ZMQ_RAWTX_PORT: ${APP_BITCOIN_KNOTS_ZMQ_RAWTX_PORT:-}
      UMBREL_CORE_IP: ${APP_BITCOIN_NODE_IP:-}
      UMBREL_CORE_RPC_PORT: ${APP_BITCOIN_RPC_PORT:-}
      UMBREL_CORE_RPC_USER: ${APP_BITCOIN_RPC_USER:-}
      UMBREL_CORE_RPC_PASS: ${APP_BITCOIN_RPC_PASS:-}
      UMBREL_CORE_ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_ZMQ_RAWBLOCK_PORT:-}
      UMBREL_CORE_ZMQ_RAWTX_PORT: ${APP_BITCOIN_ZMQ_RAWTX_PORT:-}

      # ── The Lightning node, if one is installed (detected in exports.sh) ──
      UMBREL_LND_IP: ${APP_FORKTOWER_LND_IP:-}
      UMBREL_LND_REST_PORT: ${APP_FORKTOWER_LND_REST_PORT:-}

      # ── The second Bitcoin node, which this container runs ──
      FORKTOWER_SQ_MODE: all-in-one
      FORKTOWER_SQ_P2P_PORT: "8433"
      # Pruned. Enough for everything Forktower does, and the alternative is
      # asking for a second full chain on a machine that already holds one.
      FORKTOWER_SQ_PRUNE_MB: "20000"
      FORKTOWER_SQ_BLOCKSONLY: "0"
      # Tor, both ways. The traffic says which side of a contested upgrade you
      # are watching, and that is nobody else's business.
      FORKTOWER_SQ_CLEARNET: "false"
      # Onion peers only. Off: everything already goes through Tor, and refusing
      # non-onion peers on top of that leaves a cold start with almost nowhere
      # to bootstrap from.
      FORKTOWER_SQ_ONION_ONLY: "false"
      FORKTOWER_TOR_PROXY: ${APP_BITCOIN_KNOTS_TOR_PROXY_IP:-${APP_BITCOIN_TOR_PROXY_IP:-10.21.21.11}}:${APP_BITCOIN_KNOTS_TOR_PROXY_PORT:-${APP_BITCOIN_TOR_PROXY_PORT:-9050}}

      # ── Telling you when something happens ──
      #
      # **Umbrel gives an app no settings screen and no notification system an
      # app can reach**, so without these there is no way to configure an alert
      # on this platform at all — while the dashboard tells the user, correctly,
      # that it has no way to reach them and escalates until they act. Demanding
      # an action the platform makes impossible is worse than not asking.
      #
      # Set one of these here and restart the app. Whatever you point at is told
      # the severity and the kind of thing that happened, and nothing else — not
      # which channel, not how much, not how long you have.
      FORKTOWER_NTFY_URL: ${FORKTOWER_NTFY_URL:-}
      FORKTOWER_NTFY_TOKEN: ${FORKTOWER_NTFY_TOKEN:-}
      FORKTOWER_WEBHOOK_URL: ${FORKTOWER_WEBHOOK_URL:-}

      # ── The companion watchtower ──
      #
      # On by default, and that is the point of it being here at all. Umbrel
      # gives an app no settings screen, so a tower that had to be switched on
      # would be a tower nobody switches on — and until this existed, a packaged
      # user was told to register a watchtower and given nowhere to get one.
      #
      # It watches the *second* node, which is the chain their own node cannot
      # see and therefore the chain a breach against them would be published on.
      # A tower watching the same chain as their node would be a second copy of
      # protection they already have.
      FORKTOWER_TOWER_LND_ENABLED: ${FORKTOWER_TOWER_LND_ENABLED:-true}
      # The address the Lightning app connects to. Both apps sit on the same
      # Umbrel network, so this is reachable without Tor and without publishing
      # anything to the LAN — and it is the address the dashboard tells the user
      # to paste, so it has to be the one that works from another container
      # rather than from inside this one.
      FORKTOWER_TOWER_LND_BIND: 0.0.0.0:9911
      FORKTOWER_TOWER_LND_EXTERNAL_ADDR: $APP_FORKTOWER_IP:9911
      FORKTOWER_TOWER_LND_MAX_DISK_MB: ${FORKTOWER_TOWER_LND_MAX_DISK_MB:-2048}

      # ── The dashboard ──
      #
      # Bound to every address because Umbrel's app proxy reaches it over the app
      # network, and authenticated by that proxy rather than by a second password
      # of our own.
      FORKTOWER_UI_LISTEN: 0.0.0.0:8330
      FORKTOWER_UI_AUTH: platform
      FORKTOWER_LOG_LEVEL: info
    networks:
      default:
        ipv4_address: $APP_FORKTOWER_IP
