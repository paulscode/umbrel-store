releaseNotes: >-
  Install this if you are watching the current fork. Forktower could fail to
  report a split that was really happening: it confirmed one only when both
  chains built several blocks past the point they separated, and a split is
  often exactly what stops one of them building. A split is now also confirmed
  when the separation simply persists, and you are warned within two minutes
  that one may be happening — a warning that confirms nothing and starts no
  countdown. The fork observed in production on 8 August is replayed as a
  standing test.
