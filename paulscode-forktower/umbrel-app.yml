releaseNotes: >-
  Fixes for what Forktower says to a user who already has a watchtower. On a
  fresh install it could report that your channels were protected by somebody
  else's watchtower and that this works — said once, before the watchtower
  Forktower runs here had even finished starting. A tower somebody else runs
  watches whichever chain their node follows, which cannot be seen from here.
  The tower here is the one with a known view of the chain your own node cannot
  see, so Forktower now asks you to register it alongside whatever you already
  use rather than instead of it.
