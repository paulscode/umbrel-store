manifestVersion: 1.1
id: paulscode-hashgg-companion
category: bitcoin
name: HashGG Companion
version: "0.7.2.7"
tagline: Sovereign hash routing for your BLAKE2b Datum Gateway
description: >-
  HashGG Companion exposes the stratum port of your BLAKE2b Datum Gateway (the
  Datum (BLAKE2b) app, or the Datum (BLAKE2b) Companion) to the public internet, so any miner, anywhere, can connect to your node and mine
  blocks you built.


  The difference from the ordinary HashGG is which gateway it pairs with, not
  which chain it is for. HashGG pairs with the Datum Gateway app, whatever chain
  that build follows. This one pairs with the separate Companion package, which
  exists so a second gateway can run beside the first.


  It installs and runs beside the ordinary HashGG rather than replacing it. One
  server can expose both gateways at once, and the two keep separate settings,
  separate playit.gg tunnels, and separate access to any VPS they share, so
  setting one up never disturbs the other. If you run both, the tile with
  COMPANION across the bottom of the icon is this one.


  Choose between two tunnel options directly in the web UI:


    - playit.gg, easiest setup, a managed service

    - VPS SSH tunnel, privacy focused, with no third party on the data path


  WHICH NODE IT MAKES REACHABLE


  The optional "make your Bitcoin node reachable" feature offers your BLAKE2b
  node here. It never touches the main Bitcoin package, which is the ordinary
  HashGG's job. That separation is why the two can run together without one
  advertising an address for the other's chain.


  BEFORE YOUR NODE HAS SYNCED


  A Datum Gateway does not open its stratum port until it has its first block
  template, and it cannot get one from a node that is still catching up. Until
  then this app has nothing to forward and will say it is waiting. On a fresh
  node that is hours, and it needs no action.


  For more information: https://github.com/paulscode/hashgg
developer: Paul Lamb
website: https://github.com/paulscode/hashgg
dependencies:
  - paulscode-knots-blake2b
repo: https://github.com/paulscode/hashgg
support: https://github.com/paulscode/hashgg/issues
# Not 3000, which the ordinary HashGG holds. The two are designed to be installed
# together, so a shared port would make that impossible on the one platform where
# a collision fails the whole install.
port: 3033
# Community stores must supply full URLs for icon and gallery: Umbrel's resolver
# only auto-prefixes URLs for the official umbrel-app-store.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-hashgg-companion/icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  HashGG Companion now works with PaulsCode's new Datum (BLAKE2b) app as well as
  the Datum (BLAKE2b) Companion. Both now give rented and small miners a
  difficulty that suits them even when the pool's minimum is far higher, as
  CONVOY's is behind a busy gateway. HashGG Companion keeps the gateway it already
  serves for as long as it answers; to move to Datum (BLAKE2b), set it up, then
  stop or uninstall the Datum (BLAKE2b) Companion, and HashGG Companion moves
  within a few minutes, keeping your public endpoint. The Datum (BLAKE2b)
  Companion is no longer a required dependency (Knots BLAKE2b is).


  PREVIOUS RELEASE:
  Security update. HashGG now runs on Node 24, replacing Node 18, which is end
  of life. The playit agent is updated to its current stable release, 1.0.10,
  and the image is rebuilt on a current Debian base with current CA
  certificates. Nothing you have set changes.


  IF YOU ARE UPDATING FROM 0.7.2.2 OR EARLIER, the notes from 0.7.2.5 also apply:


  The dashboard now checks that your public mining address actually carries
  stratum. Every two minutes it connects to that address the way a hash buyer
  would and confirms a stratum server answers, rather than only showing that the
  tunnel is up. When the check fails, it says whether the tunnel or the Datum
  Gateway is at fault.

submitter: Paul Lamb
