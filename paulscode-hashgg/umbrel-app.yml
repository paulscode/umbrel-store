releaseNotes: >-
  Make your Bitcoin node reachable: a new section that gives your Bitcoin node a
  public address through your VPS, so other nodes can connect to it. Your home IP
  address is never exposed to them. HashGG sets up the tunnel, gives you the one
  line to add to Bitcoin Knots, and then checks from the internet that your node
  really answers.
