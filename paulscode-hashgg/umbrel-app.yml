releaseNotes: >-
  You can now make your Bitcoin node reachable without setting up mining. It is
  offered on the first screen alongside the tunnel choices, and if you stop there
  the dashboard treats mining as a choice you have not made rather than something
  wrong.


  One server can carry both jobs whichever order you set them up in — set up
  reachability first and it is offered when you later set up mining, and the
  other way round. A second HashGG installation on another machine can share the
  same server too, without disturbing the first.


  Also fixes a dashboard row that always showed Datum Gateway as reachable
  without checking, which hid the one thing that would explain a hashrate of
  zero.
