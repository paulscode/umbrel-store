version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_KNOTS_BLAKE2B_WEB_IP
      APP_PORT: 80

  # A node has no web interface, and every Umbrel app needs something behind its
  # Open button. This is a static page saying what the app is and what to install
  # next, which is more useful than a tile that opens nothing.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # The page itself, mounted read-only over the image's own index.html. Just
      # the one file, not a directory, so the poller can still write status.json
      # beside it in the image's writable layer.
      #
      # It comes from `index.html.template`, and it lives at the app root rather
      # than in a `web/` directory, because of what umbreld copies on an update.
      # `copy_app_files` takes only `docker-compose.yml *.template exports.sh
      # torrc hooks`, so a page under `web/` reaches a fresh install and is never
      # updated again: the compose file would arrive and the page it refers to
      # would stay at whatever version was first installed. `template_app` also
      # globs only the app root, so the `.template` cannot be nested either. The
      # page contains no `$`, so `envsubst` passes it through unchanged.
      - ${APP_DATA_DIR}/index.html:/usr/share/nginx/html/index.html:ro
      # Read-only, and only for the cookie. The page reports the node's sync
      # progress, which means asking the node, which means authenticating as it
      # does. Nothing else in this container reads the chain.
      - ${APP_DATA_DIR}/data:/bitcoin:ro
    # A background poller writes the node's own getblockchaininfo to a file nginx
    # serves, and the page fetches that. Done here rather than in the browser
    # because the RPC needs the cookie, which is not the browser's to hold, and
    # bitcoind speaks no CORS. Writing the reply verbatim keeps this out of the
    # business of parsing JSON in shell: the page reads the fields it wants.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        STATUS=/usr/share/nginx/html/status.json
        printf '{"node":null,"at":0}' > "$$STATUS"
        (
          while true; do
            COOKIE=""
            for sub in regtest testnet4 testnet signet ""; do
              if [ -n "$$sub" ]; then C="/bitcoin/$$sub/.cookie"; else C="/bitcoin/.cookie"; fi
              if [ -r "$$C" ]; then COOKIE="$$C"; break; fi
            done
            NODE=null
            if [ -n "$$COOKIE" ]; then
              # Re-read every poll, so a node restart that rewrites the cookie is
              # picked up without restarting this container.
              AUTH=$$(tr -d '\r\n' < "$$COOKIE" | base64 | tr -d '\n')
              R=$$(wget -q -O - -T 10 \
                    --header "Authorization: Basic $$AUTH" \
                    --header "Content-Type: text/plain" \
                    --post-data '{"jsonrpc":"1.0","id":"s","method":"getblockchaininfo","params":[]}' \
                    "http://$APP_KNOTS_BLAKE2B_NODE_IP:$APP_KNOTS_BLAKE2B_RPC_PORT/" 2>/dev/null) || R=""
              # Only accept something that at least looks like the object it should
              # be, so a proxy error page never lands in the file as raw text.
              case "$$R" in '{'*) NODE="$$R" ;; esac
            fi
            printf '{"node":%s,"at":%s}\n' "$$NODE" "$$(date +%s)" > "$$STATUS.tmp"
            mv "$$STATUS.tmp" "$$STATUS"
            sleep 10
          done
        ) &
        exec nginx -g 'daemon off;'
    networks:
      default:
        ipv4_address: $APP_KNOTS_BLAKE2B_WEB_IP

  # Bitcoin Knots built from the BLAKE2b proof-of-work branch (PR #359),
  # following the public BLAKE2b chain on mainnet. Same image as the StartOS
  # package; the entrypoint writes bitcoin.conf from this environment.
  #
  # CHAIN is set explicitly rather than left to the image default, so what this
  # app runs is readable here. A chain chosen on the gateway's settings page is
  # written to /config/settings.json and outranks this, which is how a user
  # switches to the private chain without editing compose.
  node:
    image: paulscode/knots-blake2b:1.0.6@sha256:cb9a337b9dff17920d327edaaa58c6fb7fd3830b02039428f1af5ca05121176b
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      CHAIN: mainnet

      # Consensus-critical: the activation block's coinbase must contain this
      # string, and the gateway that builds that coinbase reads the same exported
      # value. Change it in exports.sh, not here, or the two will disagree and the
      # node will reject the block with `bad-headline`.
      #
      # That applies to the private chain, where this pair mines the activation
      # block themselves. On mainnet block 961640 was mined long before either of
      # them existed and carries a string neither can choose, so the entrypoint
      # ignores this value there and uses the real one. Which is why the exported
      # value can stay the lab headline while CHAIN is mainnet: it is not the one
      # in force. Do not "correct" it to the mainnet string, or the private chain
      # loses the only headline it can actually agree on.
      BLAKE2B_HEADLINE: ${APP_KNOTS_BLAKE2B_HEADLINE}

      # Where SHA256d stops and BLAKE2b begins. 1 means the first block mined is
      # already BLAKE2b, which is the point of the app: a Sia ASIC cannot mine
      # SHA256d at all, so any higher value would leave a miner connected,
      # receiving work it cannot use, with nothing to show why.
      BLAKE2B_ACTIVATION_HEIGHT: "1"

      # Umbrel's Docker network, not the 172.16/12 the image defaults to.
      RPC_ALLOW_IP: "10.21.0.0/16"

      # Pruned by default, and by a real margin rather than bitcoind's floor.
      # 550 MiB is the minimum it accepts and is fine for a chain that starts
      # empty, but this app can now be pointed at mainnet, where 550 is tight
      # enough to be churning constantly. 5 GiB matches the StartOS package.
      #
      # Changeable without editing this file: the Datum Gateway app's page writes
      # a settings file that both services watch, and the node entrypoint takes
      # `prune` from it in preference to this. That page is also where a full
      # node is chosen, which is the same setting at 0.
      PRUNE: "5000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Chain and payout address, written by the gateway app's page. The node
      # reads and watches this, and restarts itself when it changes, which is why
      # the restart policy above is unless-stopped rather than on-failure.
      - ${APP_DATA_DIR}/config:/config:ro
    # RPC (18443) and P2P (18444) stay on the internal network. RPC authenticates
    # with the cookie the node writes itself, and this chain has no peers to find.
    networks:
      default:
        ipv4_address: $APP_KNOTS_BLAKE2B_NODE_IP
