version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_KNOTS_BLAKE2B_NODE_IP
      APP_PORT: 3000

  # The node, and the web interface that manages it.
  #
  # This is our fork of the app the official Bitcoin Knots app runs, with one
  # bitcoind swapped in: Knots carrying the BLAKE2b proof-of-work change. So this
  # app now has the dashboard, sync progress, peer list, connect modal, advanced
  # settings and home-screen widgets that the official node app has, rather than
  # the static page it used to serve because "a node has no web interface".
  #
  # The fork is small on purpose: the bitcoind source stage, the version list, the
  # network list, the prune default, and where blocknotify points. Everything else
  # is upstream's, so it keeps getting upstream's fixes.
  app:
    # PIN THIS BY DIGEST BEFORE RELEASING. Every other image in this store is
    # `<tag>@sha256:<digest>`; a tag alone can be moved, and Umbrel will happily
    # pull whatever it points at on a later install. The digest goes in once the
    # image is published, because it does not exist until then.
    image: paulscode/umbrel-bitcoin-blake2b:1.0.0@sha256:feffd67dae555d0e564ac29580e185d4b03834200226cdb65172d89e3421bec8
    user: "1000:1000"
    restart: on-failure
    # bitcoind flushes its chainstate on shutdown, and a stop that does not wait
    # for it throws away everything since the last flush. Measured during an
    # initial sync: stopping at height 84900 came back at 327.
    stop_grace_period: 15m30s
    ports:
      - "${APP_KNOTS_BLAKE2B_P2P_PORT}:${APP_KNOTS_BLAKE2B_P2P_PORT}"
      - "${APP_KNOTS_BLAKE2B_RPC_PORT}:${APP_KNOTS_BLAKE2B_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      # WHERE THE CHAIN LIVES, AND WHY IT IS NOT data/bitcoin.
      #
      # The image defaults to /data/bitcoin, which is where the official Bitcoin
      # apps keep it. This app has kept its chain at /data since it shipped, and
      # both of these are read from the environment by the node app, so it is
      # pointed at the existing directory. The alternative was asking every
      # existing install to move several gigabytes of blocks, or to resync, to
      # match a convention that buys nothing here.
      #
      # /data/app sits inside the bitcoind data directory as a result. bitcoind
      # ignores subdirectories it does not know, so this is untidy rather than
      # harmful.
      BITCOIN_DIR: /data
      APP_STATE_DIR: /data/app

      # BITCOIND BINARY SETTINGS
      # comma-delimited list of extra startup flags to pass to bitcoind
      BITCOIND_EXTRA_ARGS: ''

      # BITCOIND CONF FILE SETTINGS
      APPS_SUBNET: "${NETWORK_IP}/16" # used for rpcallowip
      P2P_PORT: "${APP_KNOTS_BLAKE2B_P2P_PORT}"
      # Additional inbound P2P listener granting whitelisted permissions
      # (whitebind) to this port; for trusted internal apps only; do not publish
      # externally. An Electrum server pulling whole historical blocks needs it:
      # on the plain port it is subject to inbound eviction and, on a pruned node,
      # to NODE_NETWORK_LIMITED, which disconnects it for asking about a block
      # more than 288 deep.
      P2P_WHITEBIND_PORT: "${APP_KNOTS_BLAKE2B_P2P_WHITEBIND_PORT}"
      RPC_PORT: "${APP_KNOTS_BLAKE2B_RPC_PORT}"
      TOR_PORT: "${APP_KNOTS_BLAKE2B_TOR_PORT}"
      ZMQ_RAWBLOCK_PORT: "${APP_KNOTS_BLAKE2B_ZMQ_RAWBLOCK_PORT}"
      ZMQ_RAWTX_PORT: "${APP_KNOTS_BLAKE2B_ZMQ_RAWTX_PORT}"
      ZMQ_HASHBLOCK_PORT: "${APP_KNOTS_BLAKE2B_ZMQ_HASHBLOCK_PORT}"
      ZMQ_SEQUENCE_PORT: "${APP_KNOTS_BLAKE2B_ZMQ_SEQUENCE_PORT}"
      ZMQ_HASHTX_PORT: "${APP_KNOTS_BLAKE2B_ZMQ_HASHTX_PORT}"
      TOR_HOST: "${APP_KNOTS_BLAKE2B_TOR_PROXY_IP}"
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: "moneyprintergobrrr"
      I2P_HOST: "${APP_KNOTS_BLAKE2B_I2P_DAEMON_IP}"
      I2P_SAM_PORT: "7656"

      # RPC CLIENT SETTINGS
      BITCOIND_IP: "${APP_KNOTS_BLAKE2B_NODE_IP}"
      # Written into bitcoin.conf as a salted `rpcauth=` line, and shown in the
      # connect modal. bitcoind still writes its .cookie alongside, because
      # neither `rpcpassword` nor `rpcuser` is set, so apps that authenticate by
      # cookie keep working unchanged.
      RPC_USER: "${APP_KNOTS_BLAKE2B_RPC_USER}"
      RPC_PASS: "${APP_KNOTS_BLAKE2B_RPC_PASS}"

      # CONNECTION DETAILS (shown to the user in the connect modal)
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      P2P_HIDDEN_SERVICE: "${APP_KNOTS_BLAKE2B_P2P_HIDDEN_SERVICE}"
      RPC_HIDDEN_SERVICE: "${APP_KNOTS_BLAKE2B_RPC_HIDDEN_SERVICE}"
    networks:
      default:
        ipv4_address: $APP_KNOTS_BLAKE2B_NODE_IP

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: "${APP_KNOTS_BLAKE2B_TOR_PROXY_IP}"

  i2pd_daemon:
    image: purplei2p/i2pd:release-2.44.0@sha256:d154a599793c393cf9c91f8549ba7ece0bb40e5728e1813aa6dd4c210aa606f6
    user: "root"
    command: --sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
    networks:
      default:
        ipv4_address: "${APP_KNOTS_BLAKE2B_I2P_DAEMON_IP}"
