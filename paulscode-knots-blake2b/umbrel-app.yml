releaseNotes: >-
  Fixes a way to end up on mainnet without the headline mainnet requires. The chain can be written as
  either "mainnet" or "main", and only the first spelling reached the step that supplies the consensus
  headline for that chain. A node started as "main" therefore ran on mainnet with whatever headline it
  had been given, and since that headline is checked at the fork height, it would reject block 961640
  and every block after it. That looks like a peer problem rather than a misconfiguration: the node
  sits one block below the fork, fully connected, and never moves.


  The spelling is now settled before anything reads it, so both forms behave the same. This app sets
  "mainnet", so an install left as it shipped was not affected.


  On the private test chain the activation height is now always written alongside the headline, rather
  than only when one was supplied. Without a height that chain never actually activates BLAKE2b, and a
  coming upstream release refuses to start when the two are separated.
