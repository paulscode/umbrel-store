releaseNotes: >-
  Follows the public BLAKE2b test network as it now stands. That network was
  restarted on a later Bitcoin Knots release candidate, which moved where BLAKE2b
  begins and changed the value the first BLAKE2b block commits to. Both are
  consensus rules, so the previous version could not follow the restarted chain:
  it expected the switch at a height where the chain now has an ordinary block,
  and stopped there. If you had selected the public test network, it will resume
  on its own once this version starts. Nothing is deleted and there is nothing to
  set. The private test chain is unaffected, since you choose its settings
  yourself.
submitter: Paul Lamb
