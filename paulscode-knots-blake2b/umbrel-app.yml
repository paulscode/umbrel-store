releaseNotes: >-
  Fixes an update to 1.0.7 that could stop this app and leave it stopped. Updating ran a step that
  reads which chain the node is on, and that step failed when the file it reads had not been written
  yet, which is the case until the node has started once. The failure was silent and it stopped the
  update after the containers had been removed, so the app stayed down and anything being installed
  against it stayed part way through. The read no longer fails when the file is absent; it falls back
  to mainnet, which is the default anyway. If 1.0.7 left this app stopped, updating to 1.0.8 and
  starting it is the fix.


  Can now be selected as the Bitcoin node for other apps, from Umbrel's own picker. Electrs Pruned
  is the first to use it, which is what gives the BLAKE2b chain an Electrum server and so a wallet
  on this server.


  Worth being clear about what that means. Bitcoin Knots and Libre Relay in that picker are other
  implementations of the same chain. This is not: it follows the BLAKE2b chain, which parted from
  the other in August 2026 and has its own blocks and its own proof of work. Choose it where you
  want that chain. Do not choose it for a Lightning node, a payment processor, or anything holding
  value on the other chain, which would read every balance and confirmation from the wrong place.


  It also does not offer rpcauth or ZMQ, so an app needing either will not work with it and should
  not select it.
submitter: Paul Lamb
