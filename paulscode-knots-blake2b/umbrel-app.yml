releaseNotes: >-
  Moves to the final Bitcoin Knots 29.4.1 release. Every version of this app so far has been built
  from a release candidate, because there was no release to build from. There is now.


  The consensus rules do not change. The activation height stays 961640, the difficulty shift at that
  height stays the same, and the opt-in signature hash that gives replay protection is the one already
  shipped. A node running the previous version is on the same chain as one running this, so updating
  is not urgent for correctness.


  What it brings is better peer selection. The node now prefers peers that advertise the fork for its
  first outbound connections, and paces its use of DNS seeds by how many such peers it already has.
  Finding peers on this chain has been the awkward part of running it: both chains share a port and a
  message prefix, so a node that dials ordinary peers stalls one block below the fork while looking
  perfectly healthy. This release addresses that in the node itself.


  It also carries a checkpoint at the first BLAKE2b block, and takes its assumed-valid block and
  minimum chain work from this chain rather than the one it parted from, which makes a fresh sync
  faster and harder to mislead.
