manifestVersion: 1.1
id: paulscode-knots-blake2b
category: bitcoin
name: Bitcoin Knots BLAKE2b
version: "1.0.1"
tagline: A private test chain for the proposed BLAKE2b proof of work
description: >-
  A Bitcoin Knots node built from the proposed BLAKE2b proof-of-work change
  (Knots PR #359), running its own private regtest chain so you can find out
  whether a BLAKE2b ASIC you already own can mine Bitcoin blocks.


  Bitcoin uses SHA256d today. There is an open proposal to change it to BLAKE2b,
  which is the algorithm Sia mines, so the ASICs built for Sia would be able to
  mine Bitcoin. This app runs a node that enforces the proposed rules. Install
  **Datum Gateway BLAKE2b** next to it, point your miner at that, and you can see
  for yourself whether your hardware works.


  ⚠️ THIS IS A TEST CHAIN, NOT BITCOIN


  It runs `regtest`: a private chain that starts empty, has no peers, and is
  yours alone. The coins it mines are worthless by construction and cannot be
  sent anywhere. Nothing here touches Bitcoin, and BLAKE2b is a proposal that
  has not been adopted. This app exists to answer a hardware question, not to
  mine anything of value.


  WHAT IT USES


  Small. It is pruned to the minimum and the chain starts from nothing, so it is
  a few hundred megabytes rather than the hundreds of gigabytes a real node
  needs. RPC is served on the internal Docker network only and is never published
  to your LAN.


  NO WEB INTERFACE


  A Bitcoin node does not have one. Opening this app shows a short page telling
  you what to do next; the mining dashboard lives in the Datum Gateway BLAKE2b
  app.
developer: Paul Lamb
website: https://github.com/paulscode/knots-blake2b-startos
dependencies: []
repo: https://github.com/paulscode/knots-blake2b-startos
support: https://paulscode.com/c/bitcoin/8
# Not in the 3000s, where the app tiles crowd together: 3028 was already taken by
# paulscode-agent-wallet on the author's own box, and a tile port that collides
# fails the whole install with "port is already allocated". 7150 sits beside the
# gateway app's 7152/7153, so the pair reads as a pair.
port: 7150
