manifestVersion: 1.1
id: paulscode-knots-blake2b
category: bitcoin
name: Knots (BLAKE2b) Companion
version: "1.0.6"
tagline: A Bitcoin Knots node on the BLAKE2b chain, pruned so it fits alongside another
description: >-
  A Bitcoin Knots node built from the BLAKE2b proof-of-work change (Knots PR
  #359), following the BLAKE2b chain on mainnet. Install it alongside your
  existing Bitcoin node rather than in place of it: this one is pruned, so both
  chains fit on one server without room for two full blockchains.


  Bitcoin's mainnet split on 30 August 2026. The two chains part at block
  961632, and from block 961640 one of them uses BLAKE2b for proof of work
  instead of SHA256d. BLAKE2b is the algorithm Sia mines, so ASICs built for Sia
  can mine this chain. This app runs a node that follows it and enforces its
  rules.


  THIS IS A REAL CHAIN WITH REAL BLOCK REWARDS


  This is not a test chain, and that is a change from earlier versions of this
  app. Blocks you mine here pay a real subsidy to a real address, and the chain
  has other participants. Both sides of the split claim to be Bitcoin; which one
  you follow is your decision, and installing this makes it. If you want the old
  behaviour, a private chain that starts empty and is yours alone, choose it on
  the gateway's settings page and save.


  WHAT IT USES


  About 5 GB of blocks by default rather than the whole chain, plus the node's
  own data, which grows on its own. Change that on the same settings page. The
  first sync downloads the chain from the network and takes a while. RPC is
  served on the internal Docker network only and is never published to your LAN.


  NO WEB INTERFACE


  A Bitcoin node does not have one. Opening this app shows a short page telling
  you what to do next; the mining dashboard lives in the Datum (BLAKE2b)
  Companion app.
developer: Paul Lamb
website: https://github.com/paulscode/knots-blake2b-startos
dependencies: []
repo: https://github.com/paulscode/knots-blake2b-startos
support: https://paulscode.com/c/bitcoin/8
# Not in the 3000s, where the app tiles crowd together: 3028 was already taken by
# paulscode-agent-wallet on the author's own box, and a tile port that collides
# fails the whole install with "port is already allocated". 7150 sits beside the
# gateway app's 7152/7153, so the pair reads as a pair.
port: 7150
# Community stores must supply full URLs for icon and gallery — Umbrel's resolver
# only auto-prefixes URLs for the official umbrel-app-store.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-knots-blake2b/icon.png
gallery:
  - https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-knots-blake2b/gallery/1.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  This app now follows the public BLAKE2b chain on mainnet. It previously ran a
  private chain of its own, which meant the thing this app exists for took an
  extra step, and the uncommon case was the one you got by installing.


  If you were running the private chain and had chosen it on the gateway's
  settings page, that choice still wins and nothing moves. If you never chose a
  chain, this update switches you to mainnet and the node begins downloading it.
  To go back, pick the private chain on that page and save. No data is deleted
  either way: each chain keeps its own, so switching returns you to where you
  left off.


  The node keeps about 5 GB of blocks by default rather than the whole chain, so
  following mainnet costs gigabytes. The same page changes that.
submitter: Paul Lamb
