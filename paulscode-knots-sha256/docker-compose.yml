version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_KNOTS_SHA256_NODE_IP
      APP_PORT: 3000

  # The node, and the web interface that manages it: paulscode/umbrel-bitcoin-knots-sha256,
  # Retropex's umbrel-bitcoin (the interface the official Bitcoin Knots app runs) with one
  # bitcoind, the published Bitcoin Knots SHA256 release, verified against the maintainer's
  # key when the image is built (github.com/paulscode/umbrel-bitcoin-knots-sha256,
  # KNOTS-SHA256.md). Knots (SHA256) and Knots (SHA256) Companion pin the same image
  # by digest and this file is identical in both apps apart from the env prefix; the
  # companion differs only by identity, seeded settings and ports.
  #
  # SEEDED SETTINGS REACH A FRESH INSTALL ONLY. umbreld's `copy_app_files` takes
  # `docker-compose.yml`, `*.template`, `exports.sh`, `torrc` and `hooks` on an
  # update, and not `data/`. So a seeded `data/app/settings.json` (the companion's:
  # pruned, Datum notify off) lands once, on install, and is then the user's.
  #
  # A Bitcoin Knots version stored by the earlier Retropex image is moved to the one
  # build this image ships when the app starts, so an update keeps the node running.
  #
  # THE `datum` TOGGLE notifies the OFFICIAL Datum app (`datum_datum_1:21000`); the
  # URL is fixed in the image. The full node leaves it on, as the official app does;
  # the companion is seeded with it off, because it pairs with Datum (SHA256)
  # Companion instead.
  app:
    image: paulscode/umbrel-bitcoin-knots-sha256:31.1.0@sha256:591647229a050a6f6c0a026a44514c7391bedbdd951a73d61d4511d7dbba17d6
    user: "1000:1000"
    restart: on-failure
    # bitcoind flushes its chainstate on shutdown, and a stop that does not wait
    # for it throws away everything since the last flush.
    stop_grace_period: 15m30s
    ports:
      - "${APP_KNOTS_SHA256_P2P_PORT}:${APP_KNOTS_SHA256_P2P_PORT}"
      - "${APP_KNOTS_SHA256_RPC_PORT}:${APP_KNOTS_SHA256_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data # data/app and data/bitcoin
    environment:
      # BITCOIND BINARY SETTINGS
      # comma-delimited list of extra startup flags to pass to bitcoind
      BITCOIND_EXTRA_ARGS: ''

      # BITCOIND CONF FILE SETTINGS
      APPS_SUBNET: "${NETWORK_IP}/16" # used for rpcallowip
      P2P_PORT: "${APP_KNOTS_SHA256_P2P_PORT}"
      # Additional inbound P2P listener granting whitelisted permissions
      # (whitebind) to this port; for trusted internal apps only; do not publish
      # externally. An Electrum server pulling whole historical blocks needs it.
      P2P_WHITEBIND_PORT: "${APP_KNOTS_SHA256_P2P_WHITEBIND_PORT}"
      RPC_PORT: "${APP_KNOTS_SHA256_RPC_PORT}"
      TOR_PORT: "${APP_KNOTS_SHA256_TOR_PORT}"
      ZMQ_RAWBLOCK_PORT: "${APP_KNOTS_SHA256_ZMQ_RAWBLOCK_PORT}"
      ZMQ_RAWTX_PORT: "${APP_KNOTS_SHA256_ZMQ_RAWTX_PORT}"
      ZMQ_HASHBLOCK_PORT: "${APP_KNOTS_SHA256_ZMQ_HASHBLOCK_PORT}"
      ZMQ_SEQUENCE_PORT: "${APP_KNOTS_SHA256_ZMQ_SEQUENCE_PORT}"
      ZMQ_HASHTX_PORT: "${APP_KNOTS_SHA256_ZMQ_HASHTX_PORT}"
      TOR_HOST: "${APP_KNOTS_SHA256_TOR_PROXY_IP}"
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: "moneyprintergobrrr"
      I2P_HOST: "${APP_KNOTS_SHA256_I2P_DAEMON_IP}"
      I2P_SAM_PORT: "7656"

      # RPC CLIENT SETTINGS
      BITCOIND_IP: "${APP_KNOTS_SHA256_NODE_IP}"
      # Written into bitcoin.conf as a salted `rpcauth=` line, and shown in the
      # connect modal. bitcoind still writes its .cookie alongside, because
      # neither `rpcpassword` nor `rpcuser` is set, so apps that authenticate by
      # cookie keep working.
      RPC_USER: "${APP_KNOTS_SHA256_RPC_USER}"
      RPC_PASS: "${APP_KNOTS_SHA256_RPC_PASS}"

      # CONNECTION DETAILS (shown to the user in the connect modal)
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      P2P_HIDDEN_SERVICE: "${APP_KNOTS_SHA256_P2P_HIDDEN_SERVICE}"
      RPC_HIDDEN_SERVICE: "${APP_KNOTS_SHA256_RPC_HIDDEN_SERVICE}"
    networks:
      default:
        ipv4_address: $APP_KNOTS_SHA256_NODE_IP

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.14@sha256:7663d18fe37b3edd97c859aa36bb5eeaa328d86c57729db0433dff430e8abd8d
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: "${APP_KNOTS_SHA256_TOR_PROXY_IP}"

  i2pd_daemon:
    image: purplei2p/i2pd:release-2.59.0@sha256:257653c18ce0b127ef480e3d8373b3ddbf1495e842674c8cfc59909be0015979
    user: "root"
    command: --sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
    networks:
      default:
        ipv4_address: "${APP_KNOTS_SHA256_I2P_DAEMON_IP}"
