manifestVersion: 1.1
id: paulscode-knots-sha256
implements:
  - bitcoin
category: bitcoin
name: Knots (SHA256) Companion
version: "31.1.0"
tagline: A pruned Bitcoin Knots node for the SHA256 chain, to run beside your main one
description: >-
  A Bitcoin Knots node on the SHA256 chain: the same chain your Bitcoin or
  Bitcoin Knots app already follows, with Knots' policy defaults. Install it
  alongside your existing node rather than in place of it: this one is pruned,
  so both fit on one machine, and it keeps its own data, ports and settings.


  WHY YOU WOULD RUN IT


  You want a Knots node with Knots' relay and mining policy beside the node your
  other apps already depend on, or you want to pair it with Datum (SHA256)
  Companion to mine with your own templates. If you only want one Bitcoin node,
  install the official Bitcoin Knots app or the Bitcoin Knots SHA256 full node
  instead.


  HOW IT WORKS


  It runs the same web interface the official Bitcoin Knots app runs, so the
  dashboard, block and peer lists, connect modal, Advanced Settings and widgets
  are all the ones you already know. It follows Bitcoin Knots SHA256 releases
  (Bitcoin Knots' patch series maintained on top of Bitcoin Core for the SHA256
  chain, consensus-identical to Bitcoin Core) in lock-step with the Bitcoin
  Knots SHA256 full-node app.


  WHAT IT USES


  About 5 GB of blocks by default rather than the whole chain, plus the node's
  own data. Change that under Advanced Settings. The first sync downloads the
  chain from the network and takes a while: this node does not share data with
  your existing one, which is the cost of being able to run both at once.


  BLOCK FILTERS NEED THE WHOLE CHAIN


  The block filter index cannot be built on a pruned node, so while pruning is
  on, Peer Block Filters and the index are switched off when settings are saved.
  To use block filters, set pruning to 0 first and let the node sync the whole
  chain.
developer: Paul Lamb
website: https://github.com/paulscode/knots-sha256
dependencies: []
repo: https://github.com/paulscode/knots-sha256
support: https://paulscode.com/c/bitcoin/8
# 7150 is the BLAKE2b companion's and 7153 its gateway's, so the SHA256 pair
# takes 7151 and 7155. Not in the 3000s, where the app tiles crowd together and
# a collision fails the whole install with "port is already allocated".
port: 7151
# Community stores must supply full URLs for icon and gallery — Umbrel's resolver
# only auto-prefixes URLs for the official umbrel-app-store.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-knots-sha256/icon.png
gallery:
  - https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-knots-sha256/gallery/1.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Moves the node to Bitcoin Knots SHA256 31.1 (31.1.knots-sha256.20261018), built
  on Bitcoin Core 31.1, from Bitcoin Knots 29.3. It now runs the same image as the
  Knots (SHA256) full-node app: one build, the published release, verified
  against the maintainer's key. Your settings, pruning choice and chain carry
  over; a Bitcoin Knots version chosen in the old Version setting is replaced by
  this build. While pruning is on, block filters are switched off when settings
  are saved instead of stopping the node. Release notes:
  https://github.com/paulscode/knots-sha256/releases/tag/v31.1.knots-sha256.20261018

submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "5"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/i2pd
