manifestVersion: 1.1
id: paulscode-knots-sha256
implements:
  - bitcoin
category: bitcoin
name: Knots (SHA256) Companion
version: "1.0.4"
tagline: A Bitcoin Knots node that never enforces BIP-110, to run beside your main one
description: >-
  A Bitcoin Knots node on the SHA256 chain: the same chain your Bitcoin or
  Bitcoin Knots app already follows. What makes this one different is what it
  does not do. Knots ships the BIP-110 softfork, known as RDTS, and this node
  never enforces it, so if the network ever splits over BIP-110 this one stays
  on the side that does not require it.


  WHY YOU WOULD RUN IT


  Install it alongside your existing node, not instead of it. Then you have one
  node that enforces BIP-110 and one that does not, at the same time, and you
  can point each app at whichever chain it should follow. If you only want one
  Bitcoin node, the official Bitcoin Knots app is the one to install.


  HOW IT WORKS


  It runs the same web interface the official Bitcoin Knots app runs, from the
  same image, so the dashboard, block and peer lists, connect modal, Advanced
  Settings and widgets are all the ones you already know. The only difference is
  a setting: it is pinned to Bitcoin Knots v29.3.knots20260507, the last release
  before RDTS enforcement.


  THAT PIN IS THE WHOLE POINT. It is on the Version tab under Advanced Settings.
  Changing it to a newer build makes this an ordinary enforcing node and removes
  the reason to have installed it, which during a BIP-110 split means changing
  which chain it follows.


  THE BIP110 WARNING IN THE LOGS IS EXPECTED


  On every start this node logs "This version of Bitcoin Knots does not support
  the upcoming BIP110 (RDTS) network upgrade". That is not a fault and not
  something to fix. It is the build telling you exactly what you installed it
  for. A node that did not print it would be the wrong node for this app.


  WHAT IT USES


  About 5 GB of blocks by default rather than the whole chain, plus the node's
  own data. Change that under Advanced Settings. The first sync downloads the
  chain from the network and takes a while: this node does not share data with
  your existing one, which is the cost of being able to run both at once.


  DO NOT TURN ON PEER BLOCK FILTERS WHILE THIS NODE IS PRUNED


  It switches on the block filter index, and that index cannot run on a pruned
  node: bitcoind stops with "Index basic block filter index needs block data that
  has been pruned" and will not start again until the setting is off. The app
  around it still reports healthy, so the node looks fine while it is down.


  If it happens, set Peer Block Filters back off, or just restart the app: it
  turns the index off at every start while pruning is on. To use block filters,
  set pruning to 0 first and let the node sync the whole chain.
developer: Paul Lamb
website: https://github.com/paulscode/knots-prerdts-startos
dependencies: []
repo: https://github.com/paulscode/knots-prerdts-startos
support: https://paulscode.com/c/bitcoin/8
# 7150 is the BLAKE2b companion's and 7153 its gateway's, so the SHA256 pair
# takes 7151 and 7155. Not in the 3000s, where the app tiles crowd together and
# a collision fails the whole install with "port is already allocated".
port: 7151
# Community stores must supply full URLs for icon and gallery — Umbrel's resolver
# only auto-prefixes URLs for the official umbrel-app-store.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-knots-sha256/icon.png
gallery:
  - https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-knots-sha256/gallery/1.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Turns the block filter index off while the node is pruned, which it is by default.


  The two cannot run together: bitcoind exits on "Index basic block filter index needs block data
  that has been pruned" and the node does not come up, while the app around it still reports
  healthy. The setting is off for a new install and switched off automatically for an existing one
  on the next start.


  This app runs the same node image as the official Bitcoin Knots app, which is archival by default
  and so never meets the pairing. This one prunes to about 5 GB by default, which is what brings it
  within reach. If you want block filters, turn pruning off first under Advanced Settings.

  Also restores the wait for Tor to publish its hidden services before the app finishes starting. It
  called a helper path that no longer exists on umbrelOS, so it failed silently and the connect modal
  could show notyetset.onion on a first start.


  Documents a trap this app can still hit: turning on Peer Block Filters while the node is pruned
  switches on an index that cannot run on a pruned node, and bitcoind will not start until it is off.
  Restarting the app clears it. The BLAKE2b companion cannot hit this because it runs a node image
  that refuses the pairing; this one runs the stock image, which does not.


  The Tor wait now finds its helper script on older umbrelOS releases too. It looked in one place
  only, which is correct on 1.7.x and wrong on 1.4.x, where the same script lives elsewhere.

submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "5"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/i2pd
