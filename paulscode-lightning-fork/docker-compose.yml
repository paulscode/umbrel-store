version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_LIGHTNING_FORK_STATUS_IP
      APP_PORT: 80

  # The tile's front door. While the daemon has refused the selected Bitcoin
  # node, or is waiting for it to reach block 961640, every request gets a page
  # that says so; otherwise requests pass straight through to the dashboard.
  # Umbrel has no health checks, and a dashboard spinner would be the only
  # other signal that the wrong node was selected. The verdict is read from
  # the status directory only; this container never sees the wallet.
  #
  # Everything the container needs is in this file, on purpose: on an update
  # umbreld refreshes only docker-compose.yml, *.template, exports.sh, torrc
  # and hooks, so a script shipped in its own directory would be frozen at
  # whatever version was first installed.
  status:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: on-failure
    volumes:
      - "${APP_LIGHTNING_FORK_STATUS_DIR}:/status:ro"
    environment:
      DASHBOARD_UPSTREAM: "http://${APP_LIGHTNING_FORK_IP}:3006"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # nginx: serve /var/lib/status/index.html for every path while it
        # exists, proxy to the dashboard otherwise. The image's own entrypoint
        # renders this template: envsubst on DASHBOARD_UPSTREAM only, since nginx's
        # own variables are not environment variables and so survive.
        mkdir -p /etc/nginx/templates /var/lib/status
        cat > /etc/nginx/templates/default.conf.template <<'NGINX'
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }
        server {
            listen 80;
            root /var/lib/status;
            location / {
                try_files /index.html @dashboard;
            }
            location @dashboard {
                proxy_pass $${DASHBOARD_UPSTREAM};
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_read_timeout 600s;
                client_max_body_size 64m;
            }
        }
        NGINX

        # Every five seconds, read the daemon's verdict and keep index.html in
        # step with it. The file is small, flat JSON with known keys, read
        # with sed because the image carries no jq.
        field() { sed 's/\\"/'"'"'/g' /status/chain-identity.json 2>/dev/null | sed -n "s/.*\"$$1\": *\"\([^\"]*\)\".*/\1/p" | head -n 1; }
        number() { sed -n "s/.*\"$$1\": *\([0-9][0-9]*\).*/\1/p" /status/chain-identity.json 2>/dev/null | head -n 1; }
        escape() { printf '%s' "$$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
        render() {
            state=$$(field state)
            case "$$state" in
                refused)
                    title='This Bitcoin node is not on the Bitcoin BLAKE2b chain'
                    lead='Lightning Fork checked the node selected for it and could not confirm that it follows the BLAKE2b chain, so it will not run against it. Bitcoin Core, Bitcoin Knots below 29.4.1, and any node on a test network are on the wrong chain.'
                    todo='On the Umbrel home screen, right-click this app, open its settings and select a node on the BLAKE2b chain: Knots (BLAKE2b) Companion, or Bitcoin Knots 29.4.1 or later. The dashboard reopens the wallet and the daemon checks again on its own; if the time below stops moving, read the Lightning Fork logs.'
                    detail=$$(field reason)
                    ;;
                waiting)
                    headers=$$(number node_headers)
                    height=$$(number activation_height)
                    title="Waiting for the Bitcoin node to reach block $${height:-961640}"
                    lead="The chain a node follows can only be told from block $${height:-961640} onward, the first BLAKE2b block. The selected node has $${headers:-0} headers so far. Lightning Fork starts the moment that block is there."
                    todo="Nothing to do but wait for the node to sync. If it has been hours, open the node's own app and check that it is syncing."
                    detail=''
                    ;;
                *)
                    rm -f /var/lib/status/index.html
                    return
                    ;;
            esac
            updated=$$(field updated_at)
            {
                printf '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">\n'
                printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
                printf '<meta http-equiv="refresh" content="10">\n<title>Lightning Fork</title>\n'
                printf '<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000004;color:#e8ecf4;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'
                printf 'main{max-width:40rem;padding:2.5rem 1.5rem}h1{font-size:1.5rem;margin:0 0 1rem}p{margin:0 0 1rem}'
                printf '.tag{display:inline-block;padding:.2rem .6rem;border-radius:1rem;background:#072563;font-size:.85rem;margin-bottom:1.5rem}'
                printf 'code{display:block;white-space:pre-wrap;word-break:break-word;background:#0b1020;border:1px solid #1d2a4d;border-radius:.5rem;padding:.75rem;font-size:.9rem}'
                printf 'small{color:#8a93a8}</style></head><body><main>\n<div class="tag">Lightning Fork</div>\n'
                printf '<h1>%s</h1>\n<p>%s</p>\n<p>%s</p>\n' "$$(escape "$$title")" "$$(escape "$$lead")" "$$(escape "$$todo")"
                [ -n "$$detail" ] && printf '<p><code>%s</code></p>\n' "$$(escape "$$detail")"
                printf '<p><small>Last checked %s. This page refreshes on its own.</small></p>\n</main></body></html>\n' "$$(escape "$${updated:-unknown}")"
            } > /var/lib/status/index.html.tmp && mv -f /var/lib/status/index.html.tmp /var/lib/status/index.html
        }
        ( while :; do render; sleep 5; done ) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    networks:
      default:
        ipv4_address: $APP_LIGHTNING_FORK_STATUS_IP

  # The official Lightning Node dashboard, unchanged: it speaks LND's RPC,
  # which Lightning Fork keeps, and reads getinfo.chains as bitcoin/mainnet,
  # which Lightning Fork reports. The explorer link is left unset because the
  # official Mempool app follows the other chain.
  app:
    image: getumbrel/umbrel-lightning:v1.2.1@sha256:41d5e7388a15443103ec0eae583a426dcf04bd371a1371fdeea8ccae99c01972
    restart: on-failure
    volumes:
      - "${APP_LIGHTNING_FORK_NODE_DATA_DIR}:/data/.lnd"
      - "${APP_DATA_DIR}/data/lightning:/data"
    environment:
      PORT: "3006"
      TOR_PROXY_IP: "${TOR_PROXY_IP}"
      TOR_PROXY_PORT: "${TOR_PROXY_PORT}"
      BITCOIN_HOST: "${APP_BITCOIN_NODE_IP}"
      RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      RPC_USER: "${APP_BITCOIN_RPC_USER}"
      RPC_PASSWORD: "${APP_BITCOIN_RPC_PASS}"
      LND_NETWORK: "mainnet"
      LND_HOST: "${APP_LIGHTNING_FORK_NODE_IP}"
      LND_PORT: "${APP_LIGHTNING_FORK_NODE_GRPC_PORT}"
      LND_GRPC_PORT: "${APP_LIGHTNING_FORK_NODE_GRPC_PORT}"
      LND_REST_PORT: "${APP_LIGHTNING_FORK_NODE_REST_PORT}"
      LND_REST_HIDDEN_SERVICE: "${APP_LIGHTNING_FORK_REST_HIDDEN_SERVICE}"
      LND_GRPC_HIDDEN_SERVICE: "${APP_LIGHTNING_FORK_GRPC_HIDDEN_SERVICE}"
      TLS_FILE: "/data/.lnd/tls.cert"
      MACAROON_DIR: "/data/.lnd/data/chain/bitcoin/mainnet/"
      CHANNEL_BACKUP_FILE: "/data/.lnd/data/chain/bitcoin/mainnet/channel.backup"
      BACKUP_STATUS_FILE: "/statuses/backup-status.json"
      JSON_STORE_FILE: "/data/state.json"
      JSON_SETTINGS_FILE: "/data/settings.json"
      UMBREL_LND_CONF_FILEPATH: "/data/.lnd/umbrel-lnd.conf"
      LND_CONF_FILEPATH: "/data/.lnd/lnd.conf"
      LND_INITIALIZE_WITH_TOR_ONLY: "unset"
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      EXPLORER_PORT: ""
      EXPLORER_HIDDEN_SERVICE: ""
    networks:
      default:
        ipv4_address: $APP_LIGHTNING_FORK_IP

  # Lightning Fork itself: LND for the Bitcoin BLAKE2b chain, built from
  # github.com/paulscode/lightning-fork and pinned by digest. It listens on the
  # same port numbers inside and outside the container, so the connect modal
  # and a wallet on the LAN agree.
  lnd:
    hostname: "${DEVICE_DOMAIN_NAME}" # Needed so LND can generate a valid cert
    image: paulscode/lightning-fork:0.21.3-beta-blake2b.5@sha256:9f357e4d9ed8e870b14865bbb28c94c021fb229119f4ef9e7329e194ff1be3e5
    command: "${APP_LIGHTNING_FORK_COMMAND}"
    user: 1000:1000
    restart: unless-stopped
    ports:
      - "$APP_LIGHTNING_FORK_NODE_PORT:$APP_LIGHTNING_FORK_NODE_PORT"
      - "$APP_LIGHTNING_FORK_NODE_REST_PORT:$APP_LIGHTNING_FORK_NODE_REST_PORT"
      - "$APP_LIGHTNING_FORK_NODE_GRPC_PORT:$APP_LIGHTNING_FORK_NODE_GRPC_PORT"
    volumes:
      - "${APP_LIGHTNING_FORK_NODE_DATA_DIR}:/data/.lnd"
      - "${APP_LIGHTNING_FORK_STATUS_DIR}:/status"
    environment:
      HOME: /data
    networks:
      default:
        ipv4_address: $APP_LIGHTNING_FORK_NODE_IP

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
