manifestVersion: 1.1
id: paulscode-lightning-fork
category: bitcoin
name: Lightning Fork
version: "0.21.4-beta-blake2b.18.0"
tagline: A Lightning Network node for the Bitcoin BLAKE2b chain
description: >-
  Lightning Fork is LND with the changes needed to follow the Bitcoin BLAKE2b
  chain: the Bitcoin Knots hard fork that replaced SHA256d proof of work with
  BLAKE2b at block 961640 on 30 August 2026. It opens and closes channels,
  routes payments, and sends and receives over the Lightning Network on that
  chain, behind a dashboard forked from the official Lightning Node app's.


  WHICH NODE IT NEEDS


  A Bitcoin node on the BLAKE2b chain, chosen in this app's node selector. Two
  qualify: Knots (BLAKE2b) Companion from this store, and Bitcoin Knots once it
  is on 29.4.1 or later. Bitcoin Core, and any Knots below 29.4.1, are on the
  other chain. Lightning Fork checks the node once the wallet is unlocked, and
  again every five minutes, and refuses one it cannot confirm; this app's page
  then says so in words rather than spinning.


  HOW IT STAYS AWAY FROM THE SHA256 CHAIN'S LIGHTNING NETWORK


  The two chains share their history, addresses and keys, so a Lightning node
  cannot tell them apart by any ordinary check. Lightning Fork marks its peer
  handshakes, invoices and offers with a required feature bit that a Lightning
  node or wallet on the SHA256 chain following the specification refuses, and refuses
  any invoice or offer without it. It cannot connect to, pay, or be paid from the SHA256 chain's Lightning
  network by accident.


  REAL MONEY ON A YOUNG CHAIN


  Coins that existed before block 961640 exist on both chains. Lightning Fork
  signs with the chain's replay-protected signature type, but prefer funding
  channels with coins received after that block, and keep amounts modest. Back
  up after every channel open or close.


  CHANNEL BACKUPS


  The official app sends channel backups to Umbrel's backup server, which does
  not accept them from this app. Lightning Fork copies channel.backup instead
  to a place you control, chosen under Channel backups in the dashboard's
  menu: an SFTP server, a Nextcloud, Dropbox or Google Drive. The copy is
  made whenever your channels change, and Recover channels fetches it back
  from the same place. Until a target is set, the file lives only on this
  Umbrel.


  Runs beside the official Lightning Node app: it uses ports 9737, 10010 and
  8180 where that app uses 9735, 10009 and 8080, plus 7157 for the Lightning
  Fork mobile app and 9913 for the watchtower server when it is turned on. The dashboard is that app's,
  forked: named Lightning Fork, styled after this icon, its port-forwarding
  note corrected to 9737, and its transaction links pointed at mempool.guide,
  which follows the BLAKE2b chain, rather than mempool.space. With Mempool
  Pruned or Mempool installed, the dashboard can take its fee rates and
  transaction links from it instead, once it has checked that the app
  follows the BLAKE2b chain: a Mempool app connected to a node on the other
  chain is shown as such and not used.
developer: Paul Lamb
website: https://github.com/paulscode/lightning-fork
dependencies:
  - bitcoin
repo: https://github.com/paulscode/lightning-fork
support: https://paulscode.com/c/bitcoin/8
# Tile port, checked against every app installed on the author's box and every
# app in this store: a colliding tile port fails the whole install. 7156 sits
# with the store's other 715x tiles.
port: 7156
# Community stores must supply full URLs for icon and gallery; Umbrel's resolver
# only auto-prefixes them for the official store.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-lightning-fork/icon.png
gallery:
  - https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-lightning-fork/gallery/1.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Built on LND 0.21.4. It fixes HTLCs that could be left pending while a
  channel changed state (and end in a needless force close), keeps a peer from
  flooding a channel with fee updates or other messages, and fixes breach
  handling for old channel states.


  New channels are bound to this chain. Every new channel now carries
  chain-bound signatures (option_unified_sigs), as the BLAKE2b Lightning spec
  requires: a peer that has not upgraded can still connect and route over the
  channels you already have, but gets no new channel. New taproot channels
  can't be opened any more, and LND no longer opens old-style (legacy)
  channels at all; channels you already have keep working. A channel funded
  directly from a block reward is refused.


  Macaroons: give an app its own key to your node with only the access it
  needs (read only, receive payments, a Lightning wallet, or your own choice
  of permissions), with an optional expiry, and revoke it on its own. Menu,
  Macaroons.


  Safer on a shared Umbrel: only Umbrel's own sign-in now reaches the app.
  Before, any other app on the same Umbrel could reach the dashboard directly.
  Advanced Settings refuses values that could add lines to LND's settings,
  and the dashboard's dependencies are up to date.


  The bridge: it no longer counts the blocks before LND gives up on a held
  payment, quotes only invoices its node would pay, refunds a payment that
  never left, and stops quoting at a 10% market move. Offers are rate limited
  per offer and can't fill the disk.


  Lightning Fork 0.21.4-beta-blake2b.18, dashboard 1.3.2-blake2b.18.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
widgets:
  - id: "bitcoin-wallet"
    type: "text-with-buttons"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/bitcoin-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Bitcoin Wallet"
      text: "1,845,894"
      subtext: "sats"
      buttons:
        - text: "Withdraw"
          icon: "arrow-up-right"
          link: "?action=send-bitcoin"
        - text: "Deposit"
          icon: "arrow-down-right"
          link: "?action=receive-bitcoin"
  - id: "lightning-wallet"
    type: "text-with-buttons"
    refresh: "2s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Lightning Wallet"
      text: "762,248"
      subtext: "sats"
      buttons:
        - text: "Send"
          icon: "arrow-up-right"
          link: "?action=send-lightning"
        - text: "Receive"
          icon: "arrow-down-right"
          link: "?action=receive-lightning"
  - id: "lightning-stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "peers"
        - title: "Active channels"
          text: "3"
          subtext: "channels"
        - title: "Max send"
          text: "90K"
          subtext: "sats"
        - title: "Max receive"
          text: "45K"
          subtext: "sats"
backupIgnore:
  - data/lnd/data/graph/mainnet/channel.db
  - data/status
  # The bridge's SHA256 node: like this node, its channel database must
  # never come back from the past. Its wallet and macaroons go too, so that
  # on a restore Lightning Fork creates its wallet again from the derived
  # seed and restores its channels from the channel.backup kept beside them.
  # Files listed one by one, not by pattern.
  - data/lnd/sha256-node/data/graph/mainnet/channel.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/wallet.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/macaroons.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/admin.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/readonly.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/invoice.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/invoices.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/chainnotifier.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/router.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/signer.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/walletkit.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/bridge.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/bridge.macaroon.perms
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/operator.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/operator.macaroon.perms
  # Its channel backup agent's state, and above all its record of having
  # kept the copy a target already held: left out, so that after a restore
  # it keeps that copy again before its first one.
  - data/lnd/.channel-backup-sha256-state.json
  - data/lnd/.channel-backup-sha256-state.json.kept
  - data/lnd/.channel-backup-sha256.lock
  # Which node on the SHA256 chain it reads, with that node's credentials:
  # written again by the dashboard from what is installed where it is
  # restored.
  - data/lnd/bridge-sha256.conf
