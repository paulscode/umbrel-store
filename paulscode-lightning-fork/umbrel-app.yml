manifestVersion: 1.1
id: paulscode-lightning-fork
category: bitcoin
name: Lightning Fork
version: "0.21.3-beta-blake2b.13.0"
tagline: A Lightning Network node for the Bitcoin BLAKE2b chain
description: >-
  Lightning Fork is LND with the changes needed to follow the Bitcoin BLAKE2b
  chain: the Bitcoin Knots hard fork that replaced SHA256d proof of work with
  BLAKE2b at block 961640 on 30 August 2026. It opens and closes channels,
  routes payments, and sends and receives over the Lightning Network on that
  chain, behind a dashboard forked from the official Lightning Node app's.


  WHICH NODE IT NEEDS


  A Bitcoin node on the BLAKE2b chain, chosen in this app's node selector. Two
  qualify: Knots (BLAKE2b) Companion from this store, and Bitcoin Knots once it
  is on 29.4.1 or later. Bitcoin Core, and any Knots below 29.4.1, are on the
  other chain. Lightning Fork checks the node once the wallet is unlocked, and
  again every five minutes, and refuses one it cannot confirm; this app's page
  then says so in words rather than spinning.


  HOW IT STAYS AWAY FROM THE BITCOIN LIGHTNING NETWORK


  The two chains share their history, addresses and keys, so a Lightning node
  cannot tell them apart by any ordinary check. Lightning Fork marks its peer
  handshakes, invoices and offers with a required feature bit that a Lightning
  node or wallet on Bitcoin following the specification refuses, and refuses
  any invoice or offer without it. It cannot connect to, pay, or be paid from the Bitcoin Lightning
  network by accident.


  REAL MONEY ON A YOUNG CHAIN


  Coins that existed before block 961640 exist on both chains. Lightning Fork
  signs with the chain's replay-protected signature type, but prefer funding
  channels with coins received after that block, and keep amounts modest. Back
  up after every channel open or close.


  CHANNEL BACKUPS


  The official app sends channel backups to Umbrel's backup server, which does
  not accept them from this app. Lightning Fork copies channel.backup instead
  to a place you control, chosen under Channel backups in the dashboard's
  menu: an SFTP server, a Nextcloud, Dropbox or Google Drive. The copy is
  made whenever your channels change, and Recover channels fetches it back
  from the same place. Until a target is set, the file lives only on this
  Umbrel.


  Runs beside the official Lightning Node app: it uses ports 9737, 10010 and
  8180 where that app uses 9735, 10009 and 8080. The dashboard is that app's,
  forked: named Lightning Fork, styled after this icon, its port-forwarding
  note corrected to 9737, and its transaction links pointed at mempool.guide,
  which follows the BLAKE2b chain, rather than mempool.space. With Mempool
  Pruned or Mempool installed, the dashboard can take its fee rates and
  transaction links from it instead, once it has checked that the app
  follows the BLAKE2b chain: a Mempool app connected to a node on the other
  chain is shown as such and not used.
developer: Paul Lamb
website: https://github.com/paulscode/lightning-fork
dependencies:
  - bitcoin
repo: https://github.com/paulscode/lightning-fork
support: https://paulscode.com/c/bitcoin/8
# Tile port, checked against every app installed on the author's box and every
# app in this store: a colliding tile port fails the whole install. 7156 sits
# with the store's other 715x tiles.
port: 7156
# Community stores must supply full URLs for icon and gallery; Umbrel's resolver
# only auto-prefixes them for the official store.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-lightning-fork/icon.png
gallery:
  - https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-lightning-fork/gallery/1.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Coins from mining now wait for the chain's relay rule. A coinbase output
  paid to this node's wallet, for example by a mining pool, is spendable once
  a spend of it will relay: 6480 confirmations, roughly 45 days, while the
  long coinbase maturity rule is deployed. Until then the wallet no longer
  offers it, so a send or channel open is refused up front instead of
  failing at broadcast, and it is not counted in the wallet's balance: the
  dashboard shows it under the Bitcoin balance as coins from mining,
  maturing. If you received coinbase outputs in the last 45 days, your
  balance drops by that amount on this update and returns as each output
  matures. Nothing is lost.


  Mempool apps are found again on umbrelOS 1.x and 2.x, where no Mempool app
  was offered before. Both Mempool Pruned and the official Mempool are
  offered, and each is checked against block 961640: an app connected to a
  node on the other chain is shown as such and not used.


  Channel details show whether a channel's signatures are bound to this
  chain, and a Connect To line with the peer's key@host:port and a copy
  button, for opening a channel back to it. A node holding a chain-bound
  channel must not go back to a version before 0.21.3-beta-blake2b.10.


  Also: a channel funded by a coinbase is no longer given up on by the
  receiving side after a restart while it matures, and this node no longer
  asks upgraded Core Lightning peers for the stale Bitcoin channels some of
  them still hold.


  Updating from 0.21.3-beta-blake2b.7.2 or earlier? That crosses the
  coordinated feature-bit change, whose notes still apply: channels carry
  over, the conversion cannot be undone, a channel stays inactive until its
  peer has updated too, and invoices and offers created before it can no
  longer be paid.


  Lightning Fork 0.21.3-beta-blake2b.13, dashboard 1.3.2-blake2b.12.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
widgets:
  - id: "bitcoin-wallet"
    type: "text-with-buttons"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/bitcoin-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Bitcoin Wallet"
      text: "1,845,894"
      subtext: "sats"
      buttons:
        - text: "Withdraw"
          icon: "arrow-up-right"
          link: "?action=send-bitcoin"
        - text: "Deposit"
          icon: "arrow-down-right"
          link: "?action=receive-bitcoin"
  - id: "lightning-wallet"
    type: "text-with-buttons"
    refresh: "2s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Lightning Wallet"
      text: "762,248"
      subtext: "sats"
      buttons:
        - text: "Send"
          icon: "arrow-up-right"
          link: "?action=send-lightning"
        - text: "Receive"
          icon: "arrow-down-right"
          link: "?action=receive-lightning"
  - id: "lightning-stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "peers"
        - title: "Active channels"
          text: "3"
          subtext: "channels"
        - title: "Max send"
          text: "90K"
          subtext: "sats"
        - title: "Max receive"
          text: "45K"
          subtext: "sats"
backupIgnore:
  - data/lnd/data/graph/mainnet/channel.db
  - data/status
