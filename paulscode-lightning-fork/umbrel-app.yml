releaseNotes: >-
  Resize channels without closing them. A channel's details in the dashboard
  have Add funds (from your on-chain wallet) and Move funds out (to your
  wallet or an address). The channel keeps working while the change confirms
  and costs one on-chain transaction. This is splicing, and it is off until
  you turn it on in Advanced Settings, Channels, Resize Channels (Splicing).


  Before you turn it on: it upgrades the node's channel database at the next
  start, and after that the app can't go back to an older version of
  Lightning Fork. Both nodes of a channel need splicing (Lightning Fork from
  this version, or the Core Lightning port), and only channels with
  chain-bound signatures can be resized.


  A resize counts once both nodes have seen six confirmations; one your peer
  adds coins to waits longer, up to 36, the larger the coins. Until then the
  channel works at its old size. If your peer adds its own coins, your node
  won't let the peer spend them through the channel until the resize has 36
  confirmations, so a peer that undoes its deposit by reorganising the chain
  can't take your funds with it. Moving funds out: the amount you enter is
  what arrives, and the fee comes from your side of the channel. With a
  Core Lightning peer, let one resize finish before either side starts
  another. Channel backups made after a resize carry the new funding output.


  Also: the dashboard says so when LND can't follow a channel's funding
  output, and a node on a pruned Knots can fetch the blocks it pruned from
  peers again (it refused them and banned the peer that sent them).


  From 0.21.4-beta-blake2b.18.0, if you are updating from an earlier version:
  built on LND 0.21.4. Every new channel carries chain-bound signatures, and a
  peer that has not upgraded gets no new channel; no new taproot or legacy
  channels. Apps can get their own macaroon from the dashboard's menu. Only
  Umbrel's own sign-in reaches the app.


  Lightning Fork 0.21.4-beta-blake2b.19, dashboard 1.3.2-blake2b.19.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
widgets:
  - id: "bitcoin-wallet"
    type: "text-with-buttons"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/bitcoin-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Bitcoin Wallet"
      text: "1,845,894"
      subtext: "sats"
      buttons:
        - text: "Withdraw"
          icon: "arrow-up-right"
          link: "?action=send-bitcoin"
        - text: "Deposit"
          icon: "arrow-down-right"
          link: "?action=receive-bitcoin"
  - id: "lightning-wallet"
    type: "text-with-buttons"
    refresh: "2s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Lightning Wallet"
      text: "762,248"
      subtext: "sats"
      buttons:
        - text: "Send"
          icon: "arrow-up-right"
          link: "?action=send-lightning"
        - text: "Receive"
          icon: "arrow-down-right"
          link: "?action=receive-lightning"
  - id: "lightning-stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "peers"
        - title: "Active channels"
          text: "3"
          subtext: "channels"
        - title: "Max send"
          text: "90K"
          subtext: "sats"
        - title: "Max receive"
          text: "45K"
          subtext: "sats"
backupIgnore:
  - data/lnd/data/graph/mainnet/channel.db
  - data/status
  # The bridge's SHA256 node: like this node, its channel database must
  # never come back from the past. Its wallet and macaroons go too, so that
  # on a restore Lightning Fork creates its wallet again from the derived
  # seed and restores its channels from the channel.backup kept beside them.
  # Files listed one by one, not by pattern.
  - data/lnd/sha256-node/data/graph/mainnet/channel.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/wallet.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/macaroons.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/admin.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/readonly.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/invoice.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/invoices.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/chainnotifier.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/router.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/signer.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/walletkit.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/bridge.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/bridge.macaroon.perms
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/operator.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/operator.macaroon.perms
  # Its channel backup agent's state, and above all its record of having
  # kept the copy a target already held: left out, so that after a restore
  # it keeps that copy again before its first one.
  - data/lnd/.channel-backup-sha256-state.json
  - data/lnd/.channel-backup-sha256-state.json.kept
  - data/lnd/.channel-backup-sha256.lock
  # Which node on the SHA256 chain it reads, with that node's credentials:
  # written again by the dashboard from what is installed where it is
  # restored.
  - data/lnd/bridge-sha256.conf
