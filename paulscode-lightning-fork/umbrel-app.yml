widgets:
  - id: "bitcoin-wallet"
    type: "text-with-buttons"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/bitcoin-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Bitcoin Wallet"
      text: "1,845,894"
      subtext: "sats"
      buttons:
        - text: "Withdraw"
          icon: "arrow-up-right"
          link: "?action=send-bitcoin"
        - text: "Deposit"
          icon: "arrow-down-right"
          link: "?action=receive-bitcoin"
  - id: "lightning-wallet"
    type: "text-with-buttons"
    refresh: "2s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Lightning Wallet"
      text: "762,248"
      subtext: "sats"
      buttons:
        - text: "Send"
          icon: "arrow-up-right"
          link: "?action=send-lightning"
        - text: "Receive"
          icon: "arrow-down-right"
          link: "?action=receive-lightning"
  - id: "lightning-stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "peers"
        - title: "Active channels"
          text: "3"
          subtext: "channels"
        - title: "Max send"
          text: "90K"
          subtext: "sats"
        - title: "Max receive"
          text: "45K"
          subtext: "sats"
backupIgnore:
  - data/lnd/data/graph/mainnet/channel.db
  - data/status
  # The bridge's SHA256 node: like this node, its channel database must
  # never come back from the past. Its wallet and macaroons go too, so that
  # on a restore Lightning Fork creates its wallet again from the derived
  # seed and restores its channels from the channel.backup kept beside them.
  # Files listed one by one, not by pattern.
  - data/lnd/sha256-node/data/graph/mainnet/channel.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/wallet.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/macaroons.db
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/admin.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/readonly.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/invoice.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/invoices.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/chainnotifier.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/router.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/signer.macaroon
  - data/lnd/sha256-node/data/chain/bitcoin/mainnet/walletkit.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/bridge.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/bridge.macaroon.perms
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/operator.macaroon
  - data/lnd/data/chain/bitcoin/mainnet/bridge/sha256/operator.macaroon.perms
  # Its channel backup agent's state, and above all its record of having
  # kept the copy a target already held: left out, so that after a restore
  # it keeps that copy again before its first one.
  - data/lnd/.channel-backup-sha256-state.json
  - data/lnd/.channel-backup-sha256-state.json.kept
  - data/lnd/.channel-backup-sha256.lock
  # Which node on the SHA256 chain it reads, with that node's credentials:
  # written again by the dashboard from what is installed where it is
  # restored.
  - data/lnd/bridge-sha256.conf
