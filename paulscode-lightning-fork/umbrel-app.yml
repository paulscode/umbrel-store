releaseNotes: >-
  The coordinated upgrade of Lightning on this chain. Lightning Fork and
  privkeyio's Core Lightning (from v26.06.8-blake2b.5) now mark themselves
  with the feature bits both projects agreed on. Updated nodes connect to
  each other; they do not connect to nodes that have not updated, in either
  direction. Update now: a channel whose peer has not updated yet stays
  inactive until it does, then resumes on its own.


  You do not need to close any channels. The first start converts the
  node's channel database once, and every open channel carries over,
  including one that is still closing. A channel whose peer has not updated
  yet shows as inactive, and becomes active again as soon as that peer
  updates. Do not force close a channel only because it is inactive right
  after the update. In the hour before you update, avoid sending or routing
  payments, so that none is still pending while your peers are updating too.


  The conversion cannot be undone. Once this version has started, an
  earlier version refuses to start on the same data, so there is no going
  back to it.


  Invoices and offers created before this update can no longer be paid.
  Offers are switched off automatically on the first start and show as
  disabled. Create new ones, and if a mining pool pays you to an offer,
  give the pool the new offer's string.


  This version also follows the chain's temporary long coinbase maturity
  rule, which raises the wait on newly mined coins from 100 blocks to 6480,
  roughly 45 days. It does not affect channels that are already open. A
  channel funded directly by a coinbase transaction now waits the full 6480
  before it is treated as usable. This node's own wallet still offers
  freshly mined coins after 100 confirmations, and a transaction spending
  them is refused when it is broadcast; nothing is lost, but keep freshly
  mined coins out of this node's wallet. If you run the Bitcoin node this
  connects to, update it as well.


  Lightning Fork 0.21.3-beta-blake2b.12, dashboard 1.3.2-blake2b.11.
submitter: Paul Lamb
submission: https://github.com/paulscode/umbrel-store
widgets:
  - id: "bitcoin-wallet"
    type: "text-with-buttons"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/bitcoin-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Bitcoin Wallet"
      text: "1,845,894"
      subtext: "sats"
      buttons:
        - text: "Withdraw"
          icon: "arrow-up-right"
          link: "?action=send-bitcoin"
        - text: "Deposit"
          icon: "arrow-down-right"
          link: "?action=receive-bitcoin"
  - id: "lightning-wallet"
    type: "text-with-buttons"
    refresh: "2s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Lightning Wallet"
      text: "762,248"
      subtext: "sats"
      buttons:
        - text: "Send"
          icon: "arrow-up-right"
          link: "?action=send-lightning"
        - text: "Receive"
          icon: "arrow-down-right"
          link: "?action=receive-lightning"
  - id: "lightning-stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "peers"
        - title: "Active channels"
          text: "3"
          subtext: "channels"
        - title: "Max send"
          text: "90K"
          subtext: "sats"
        - title: "Max receive"
          text: "45K"
          subtext: "sats"
backupIgnore:
  - data/lnd/data/graph/mainnet/channel.db
  - data/status
