releaseNotes: >-
  - Lightning Fork on LND 0.21.8. Among its fixes: on a node without a
  transaction index, such as one using a pruned Bitcoin node, a channel
  could stay "opening" after its funding transaction confirmed, because
  LND's record of how far it had looked moved past the block that
  confirmed it. After this update such a channel finds its confirmation
  and opens. A peer whose channel is still waiting for its funding to
  confirm gets the reconnection message it expects, so it no longer
  disconnects and takes your other channels with it offline; a deadlock
  between a failing channel and a cooperative close is fixed; and sweeps,
  forwarded payments across reconnections and AMP payments recover better.

  - Resize channels: after a resize, the payments and fee updates your
  peer sends again when you reconnect are accepted under the reserves from
  before the resize until its next commitment, instead of closing the
  connection on every reconnection.

  - Apps that reconnect your peers every few minutes, such as LNDg, no
  longer pile up hundreds of connection attempts to a peer that is
  offline.

  - Raising the fee of a cooperative close just after a reconnection now
  waits until the channel is ready for it, instead of failing (from
  2rdzy).

  - The bridge's SHA256 node runs LND 0.21.8.

  - Channel backups use rclone 1.75.2, checked against its published
  checksum, instead of 1.68.2, and say that LND writes channel.backup each
  time it starts, once it has caught up with the chain.

  - Dashboard 1.3.2-blake2b.24: a channel whose peer has no name yet shows
  the peer's key instead of a loading bar, and peer names are shown
  without control characters.


  From 0.21.6-beta-blake2b.23.0, if you are updating from an earlier
  version:


  - The bridge: a swap whose hold invoice the node deleted (with the
  gc-canceled-invoices options on) now ends instead of retrying forever,
  once the bridge has checked it is reading the node that issued the
  invoice; on any other node it stops and is listed as needing the
  operator. A swap already stuck this way ends after the update.

  - With a pruned Bitcoin node, blocks it has pruned are fetched only from
  peers that advertise the BLAKE2b service bit, which Bitcoin Knots 29.4.3
  requires before it serves blocks past the fork.


  From 0.21.6-beta-blake2b.22.0, if you are updating from an earlier
  version: Lightning Fork on LND 0.21.6.


  - Splices: after an aborted splice attempt, the channel's reserves now
  change at the next connection, as the spec says. If your channel's peer
  runs Lightning Fork 0.21.4-beta-blake2b.19 to .21.3, upgrade both, or
  reconnect after each splice locks: otherwise a later aborted attempt can
  leave the two sides disagreeing about reserves until they reconnect, which
  at worst force closes the channel.

  - LND no longer proposes or accepts a commitment fee rate below 253
  sat/kw. A node on an older release with a maximum commitment fee rate of 1
  sat/vB cannot open a channel to yours until it raises that setting or
  upgrades.

  - The bridge copes with a SHA256 node slow to answer, which a busy or
  pruned SHA256 Bitcoin node causes: it says the node is slow and why, waits
  up to 5 minutes before calling it unreachable, and no longer reports a slow
  wallet unlock as a wrong password. Quotes whose payout has no usable route
  are refused instead of funded and refunded.

  - BOLT 12: a paid invoice is kept as the payment's request.

  - Dashboard 1.3.2-blake2b.22: whole numbers where LND reads whole numbers,
  the watchtower sweep fee rate, no trust in the certificate roots behind the
  compromised eMudhra keys, and the coinbase maturity of Bitcoin Knots 29.4.3
  in the wallet.


  From 0.21.4-beta-blake2b.21.3.0, if you are updating from an earlier
  version: coinbase maturity under Bitcoin Knots 29.4.3: bitcoins mined in block 979919
  or later need 25920 confirmations (about 180 days) before a spend of them is
  accepted, until RDTS expires in September 2027, while bitcoins mined before
  keep 6480 (about 45 days). The wallet now offers and counts each mined output
  by the rule its block falls under, and a channel funded by your own mined
  output waits as long. Earlier versions would have offered an output from
  block 979919 after 6480 confirmations, which upgraded nodes refuse to relay;
  that could first happen at block 986399, so nothing has gone wrong yet. This
  only concerns a wallet paid directly by mining. Nothing else changes.


  From 0.21.4-beta-blake2b.21.2.0, if you are updating from an earlier
  version: Fixes:


  - Recover channels in the dashboard works. In every earlier release LND
  refused every backup restored there as one from another chain.

  - Apps that follow channel events (SubscribeChannelEvents) no longer have
  their stream cut with "internal server error" at the first payment on a
  channel, which started in 0.21.4-beta-blake2b.19.

  - The bridge's SHA256 node no longer stops answering while it learns the
  SHA256 Lightning network. It checked every public channel against the
  SHA256 Bitcoin node one block at a time, which on a pruned node took hours,
  and the bridge timed out waiting. It now takes channel announcements as
  given, as phone wallets do, so a payment may occasionally try a channel
  that has since closed and then route around it. Its own channels are
  watched on chain as before.

  - The SHA256 node runs LND 0.21.6, and Lightning Fork's own LND now turns
  off Multipath TCP listeners itself (CVE-2026-98432), as the app already
  did for both.


  From 0.21.4-beta-blake2b.21.1.1, if you are updating from an earlier
  version: Security: Lightning Fork's nodes now listen on plain TCP instead of
  Multipath TCP. A serious Linux kernel bug, CVE-2026-98432, has a published
  attack that takes over a server through a Multipath TCP listener, and Go
  programs such as LND listen that way by default. This closes that route. It
  does not fix the kernel bug, which needs an umbrelOS update with a patched
  kernel; until then, if your node accepts peer connections from the internet
  rather than only through Tor, consider turning that off.


  Also Tor 0.4.9.14, a security release of Tor.


  From 0.21.4-beta-blake2b.21.1.0, if you are updating from an earlier
  version: Lightning Fork is built with Go 1.27.3, which stops
  trusting a set of compromised certificate authority intermediates
  (CVE-2026-111943). Earlier builds still trusted them for the node's
  outbound HTTPS: fee estimates from a fee URL and, if you run the bridge,
  its price sources. Nothing else changes.


  From 0.21.4-beta-blake2b.21.0, if you are updating from an earlier version:
  pay short-lived SHA256 invoices through a bridge. Shops often issue
  invoices that live about a minute; the bridge refused anything with less
  than 15 minutes left and now quotes an invoice while it has at least 20
  seconds. The phone app (0.2.3) gets a firm price as soon as an invoice is
  scanned, shows its countdown, and pays in one tap. Both the bridge and the
  paying node need this version. If a payout can't arrive in time, the payer
  is refunded within seconds.


  Channel backups: a warning before Google ends a Drive sign-in (a Google
  Cloud app still in Testing ends it after 7 days), and a refused sign-in
  explained, with the sign-in link offered again. Bridge hold invoices carry
  the destination invoice's payment metadata.


  From 0.21.4-beta-blake2b.20.0, if you are updating from an earlier version:
  a hardened bridge after a private security review by cguida (thank you),
  bridge pricing from two exchanges, and no bridge outage after a difficulty
  retarget. From 0.21.4-beta-blake2b.19.0: resize channels without closing
  them, off until you turn it on in Advanced Settings, Channels, Resize
  Channels (Splicing); turning it on upgrades the channel database, and the
  app can't go back to an older version of Lightning Fork after that.


  Lightning Fork 0.21.8-beta-blake2b.24, dashboard 1.3.2-blake2b.24.
