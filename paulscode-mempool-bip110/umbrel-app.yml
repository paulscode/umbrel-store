description: >-
  A specialized fork of the Mempool block explorer that visualizes BIP-110
  (Reduced Data Temporary Softfork) related activity on the Bitcoin network.


  BIP-110 proposes restricting certain rarely-used script features to reduce
  the maximum possible block validation data from ~4GB to ~400KB per block,
  making Bitcoin more resilient and easier to run on modest hardware.


  Features:

  • Highlights blocks from miners signaling BIP-110 support with green/gold
  celebratory visuals

  • Identifies transactions that would violate BIP-110 consensus rules with
  neon orange warning indicators

  • Detects all 7 BIP-110 rule violations: large scriptPubKeys, large
  PUSHDATA/witness elements, undefined witness versions, taproot annex,
  large control blocks, OP_SUCCESS, and OP_IF/OP_NOTIF in tapscripts

  • Full Mempool explorer functionality including mempool visualization,
  block explorer, transaction details, and mining dashboard


  Based on Mempool v3.2.1. Requires a fully synced Bitcoin node.
releaseNotes: >-
  v3.2.1.4 update:

  • Prepared for mandatory signaling and activation: block colours and wording
  now depend on the block's height and on whether your node enforces BIP-110

  • Blocks that are invalid *now* show red, distinct from amber for violations
  that are only hypothetical or historical

  • Detects whether your node enforces BIP-110 and says so plainly; an enforcing
  node cannot have accepted an invalid block, so contradictions are shown as
  unverified rather than red

  • Reports whether the chain your node follows obeys BIP-110 at all, naming the
  first diverging block

  • Implements the spec's exemption for inputs spending UTXOs created before
  activation, so valid post-activation blocks are not flagged

  • Gold milestone markers for the start of mandatory signaling, lock-in,
  activation and expiry

  • Deployment card reworked per phase, including a mandatory-signaling bar
  (every block must signal, not 55%)

  • Fixed: violation counts could survive a reorg, unknown counts could read as
  "no violations", and the newest blocks could go unscanned

  • Based on Mempool v3.2.1
