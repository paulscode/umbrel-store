version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_MEMPOOL_PRUNED_IP
      APP_PORT: $APP_MEMPOOL_PRUNED_PORT

  web:
    image: ghcr.io/paulscode/mempool-pruned-frontend:v3.3.1-pruned.8@sha256:c6a805fd510e6d241e21be736d8bd890ea944aaac458266a1ab444e5c1fd97fa
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    # The Lightning tab shows only when LIGHTNING is set, and whether the api
    # turned the Lightning pages on is decided there, at its start (see its
    # command). So with Lightning Fork installed this asks the api, once it
    # answers, and sets LIGHTNING from what it says. The api first waits for the
    # database and may take a minute to ask its node which chain it is on, so
    # this waits up to three minutes, then leaves the tab off. Without
    # Lightning Fork it goes straight on. Either way it then runs the image's
    # own entrypoint with the command this app always used.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${LIGHTNING_FORK:-false}" = "true" ]; then
          info=""
          attempt=0
          while [ "$$attempt" -lt 36 ]; do
            info="$$(curl -fsS --max-time 5 "http://$${BACKEND_MAINNET_HTTP_HOST}:$${BACKEND_MAINNET_HTTP_PORT}/api/v1/backend-info" 2>/dev/null || true)"
            [ -n "$$info" ] && break
            attempt=$$((attempt + 1))
            sleep 5
          done
          case "$$info" in
            *'"lightning":true'*)
              echo "web: Lightning tab on"
              export LIGHTNING=true ;;
            "")
              echo "web: the api did not answer; Lightning tab off until the next start" ;;
            *)
              echo "web: the api has the Lightning pages off; Lightning tab off" ;;
          esac
        fi
        exec /patch/entrypoint.sh ./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'
    environment:
      LIGHTNING_FORK: $APP_MEMPOOL_PRUNED_LIGHTNING_FORK
      FRONTEND_HTTP_PORT: $APP_MEMPOOL_PRUNED_PORT
      BACKEND_MAINNET_HTTP_HOST: $APP_MEMPOOL_PRUNED_API_IP
      BACKEND_MAINNET_HTTP_PORT: "8999"
      NGINX_PORT: $APP_MEMPOOL_PRUNED_PORT
      NGINX_HOSTNAME: $APP_MEMPOOL_PRUNED_API_IP
    depends_on:
      - api
      - db
    networks:
      default:
        ipv4_address: $APP_MEMPOOL_PRUNED_IP

  api:
    image: ghcr.io/paulscode/mempool-pruned-backend:v3.3.1-pruned.8@sha256:e63c1cd5460a6d2c9a4b0ec0f004da1800bc5da8fe55281b388e9e135d0506ba
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    # How the chosen node authenticates differs between nodes and is not a setting.
    # The official Bitcoin Node uses rpcauth and exports a user and password; the
    # BLAKE2b companion uses the cookie it writes itself and deliberately exports
    # neither. An empty user is the signal for the second.
    #
    # It has to be detected here rather than left to the backend. `start.sh` assigns
    # its defaults with `:=`, which treats empty exactly like unset, so an empty user
    # silently becomes `mempool`/`mempool` and every Core RPC call is rejected by the
    # proxy. Failing loudly on a missing cookie beats authenticating as the wrong
    # user and reporting it as the node being unreachable.
    #
    # The cookie is located by probing the chain subdirectories bitcoind uses for
    # anything but mainnet, exactly as the electrs and proxy entrypoints do. The
    # backend re-reads the file when auth fails, so a node restart that rewrites the
    # cookie recovers on its own.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${CORE_RPC_USERNAME:-}" ]; then
          COOKIE=""
          for sub in regtest testnet4 testnet signet ""; do
            if [ -n "$$sub" ]; then C="/bitcoin/$$sub/.cookie"; else C="/bitcoin/.cookie"; fi
            if [ -r "$$C" ]; then COOKIE="$$C"; break; fi
          done
          if [ -z "$$COOKIE" ]; then
            echo "api: the selected Bitcoin node exports no RPC user, so cookie auth is expected," >&2
            echo "api: but no readable .cookie was found under /bitcoin. Is that node running?" >&2
            exit 1
          fi
          echo "api: authenticating to the proxy with $$COOKIE"
          export CORE_RPC_COOKIE=true
          export CORE_RPC_COOKIE_PATH="$$COOKIE"
        fi
        # The Lightning pages, from Lightning Fork, when exports.sh found it
        # installed. Two more things must hold, and either failing leaves the
        # pages off for this run (the next start checks again) rather than
        # stopping the explorer:
        #
        # - Lightning Fork has a wallet. Until it does there is no macaroon,
        #   and the backend stops at start on one it cannot read.
        # - This explorer's node is on the BLAKE2b chain, where Lightning
        #   Fork's channels are funded. Each app picks its own Bitcoin node, so
        #   this one may be reading the SHA256 chain, which would date and size
        #   every channel from a block that does not hold it. The chains are
        #   told apart by the first BLAKE2b block, 961640, as Lightning Fork's
        #   dashboard does. The node may still be starting, so it is asked for
        #   a minute before giving up.
        if [ "$${LIGHTNING_ENABLED:-false}" = "true" ]; then
          if [ ! -r "$${LND_MACAROON_PATH}" ]; then
            echo "api: Lightning Fork is installed but has no wallet yet; Lightning pages off until the next start"
            export LIGHTNING_ENABLED=false
          else
            chain=""
            for attempt in 1 2 3 4 5 6; do
              chain="$$(node -e '
                const http = require("http"), fs = require("fs"), env = process.env;
                const BLAKE2B_961640 = "0000000000000050c1e5f69672f459293be14f46e5a494e7a8c8541396f18eeb";
                let auth;
                try {
                  auth = env.CORE_RPC_COOKIE === "true"
                    ? fs.readFileSync(env.CORE_RPC_COOKIE_PATH, "utf8").trim()
                    : env.CORE_RPC_USERNAME + ":" + env.CORE_RPC_PASSWORD;
                } catch (e) { process.exit(0); }
                const req = http.request({ host: env.CORE_RPC_HOST, port: env.CORE_RPC_PORT, method: "POST", auth,
                  headers: { "content-type": "application/json" }, timeout: 10000 }, (res) => {
                  let body = "";
                  res.on("data", (c) => { body += c; });
                  res.on("end", () => {
                    try {
                      const r = JSON.parse(body);
                      if (r.result) console.log(r.result === BLAKE2B_961640 ? "blake2b" : "other");
                      else if (r.error && r.error.code === -8) console.log("behind");
                    } catch (e) {}
                  });
                });
                req.on("timeout", () => req.destroy());
                req.on("error", () => {});
                req.end(JSON.stringify({ jsonrpc: "1.0", id: "mempool-pruned", method: "getblockhash", params: [961640] }));
              ' 2>/dev/null || true)"
              [ -n "$$chain" ] && break
              sleep 10
            done
            case "$$chain" in
              blake2b)
                echo "api: Lightning pages on, from Lightning Fork at $${LND_REST_API_URL}" ;;
              other)
                echo "api: this explorer's node is on the SHA256 chain and Lightning Fork's channels are on the BLAKE2b chain; Lightning pages off"
                export LIGHTNING_ENABLED=false ;;
              behind)
                echo "api: this explorer's node has not reached the BLAKE2b chain's first block, so its chain is unknown; Lightning pages off until the next start"
                export LIGHTNING_ENABLED=false ;;
              *)
                echo "api: could not ask this explorer's node which chain it is on; Lightning pages off until the next start"
                export LIGHTNING_ENABLED=false ;;
            esac
          fi
        fi
        # Drop an oversized RBF cache before handing over to the backend.
        #
        # Mempool restores rbfcache.json with a whole-file read and JSON.parse
        # before the backend is healthy, and a large enough file aborts V8
        # before app-level error handling gets control. `restart: on-failure`
        # then starts the same container again, reads the same file, and aborts
        # again: a loop nothing inside the application can break.
        #
        # The guard belongs in this command and not in an Umbrel pre-start hook
        # because Docker reruns the command on every restart, while hooks only
        # run when Umbrel starts or updates the app.
        #
        # Unlike the official app, MEMPOOL_CACHE_DIR here is a path inside the
        # container rather than a host bind mount, so the file dies with the
        # container. That narrows the window to restarts of one container, which
        # is exactly the window the loop lives in.
        #
        # Ported from getumbrel/umbrel-apps 9fcf1334.
        max="$${MEMPOOL_RBF_CACHE_MAX_BYTES:-0}"
        case "$${max}" in
          ""|*[!0-9]*) max="0" ;;
        esac
        if [ "$${max}" -gt 0 ]; then
          for file in /backend/cache/rbfcache.json /backend/cache/tmp-rbfcache.json; do
            if [ -f "$${file}" ]; then
              size="$$(wc -c < "$${file}" | tr -d "[:space:]")"
              case "$${size}" in
                ""|*[!0-9]*) size="0" ;;
              esac
              if [ "$${size}" -gt "$${max}" ]; then
                rm -f "$${file}"
                echo "mempool startup: removed oversized $${file} ($${size} bytes > $${max} bytes)"
              fi
            fi
          done
        fi
        exec ./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh
    environment:
      # Core RPC points at the Electrs Pruned app's btc-rpc-proxy, not at the
      # Bitcoin Node. Dropping txindex is what Electrum below is for, but it is
      # not the whole story: Mempool still calls `getblock` for the block pages
      # and for mining indexing, and a pruned node answers "Block not available
      # (pruned data)" for anything below its prune height. The proxy answers
      # those from the p2p network and verifies them, so this is the difference
      # between an old block page being slow and it failing outright.
      #
      # On StartOS the bitcoind package runs the proxy itself when pruning is
      # on, so pointing at the node is already pointing at the proxy there.
      # Umbrel has no equivalent, hence the explicit address.
      #
      # The credentials are still the node's: the proxy runs with
      # passthrough_rpcauth against the node's bitcoin.conf, so it accepts
      # exactly what the node accepts and no second secret exists.
      CORE_RPC_HOST: $APP_ELECTRS_PRUNED_PROXY_IP
      CORE_RPC_PORT: $APP_ELECTRS_PRUNED_PROXY_PORT
      # Empty when the chosen node authenticates with the cookie it writes itself
      # rather than with rpcauth, which is what the BLAKE2b companion does. The
      # command below detects that and switches to cookie auth; see there.
      CORE_RPC_USERNAME: $APP_BITCOIN_RPC_USER
      CORE_RPC_PASSWORD: $APP_BITCOIN_RPC_PASS

      # Electrs Pruned, not the official Electrs. That is the whole point: the
      # official one requires an archival node with txindex, and this one indexes
      # a pruned node by fetching dropped blocks from the peer-to-peer network.
      ELECTRUM_HOST: $APP_ELECTRS_PRUNED_SERVER_IP
      ELECTRUM_PORT: $APP_ELECTRS_PRUNED_SERVER_PORT
      ELECTRUM_TLS: "false"

      DATABASE_ENABLED: "true"
      DATABASE_HOST: $APP_MEMPOOL_PRUNED_DB_IP
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"

      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_CACHE_DIR: "/backend/cache"
      # electrum is what makes a pruned node workable. Do not set this to esplora
      # or none: address lookups and confirmed transactions both route through it.
      MEMPOOL_BACKEND: "electrum"
      MEMPOOL_NETWORK: "mainnet"
      MEMPOOL_CLEAR_PROTECTION_MINUTES: "20"
      # A year of blocks, matching the StartOS package and upstream's default.
      # On a pruned node every block below the prune height is a p2p fetch, so
      # the first index is slow, and slower again if the node is behind Tor.
      # Lower it to shorten that, or 0 to skip mining indexing entirely; the
      # explorer itself does not depend on it. It is still a small fraction of
      # what Electrs Pruned already fetched to build its own index.
      MEMPOOL_INDEXING_BLOCKS_AMOUNT: "52560"
      MEMPOOL_STDOUT_LOG_MIN_PRIORITY: "info"
      # The ceiling the startup guard above compares against. Without it the
      # guard reads 0 and does nothing, which is how a no-op guard hides in
      # plain sight. 64 MiB, the same figure the official app uses.
      MEMPOOL_RBF_CACHE_MAX_BYTES: "${APP_MEMPOOL_PRUNED_RBF_CACHE_MAX_BYTES:-67108864}"
      MEMPOOL_AUTOMATIC_POOLS_UPDATE: "true"
      MEMPOOL_RUST_GBT: "true"
      MEMPOOL_CPFP_INDEXING: "false"
      MEMPOOL_AUDIT: "false"
      MEMPOOL_ALLOW_UNREACHABLE: "true"

      # Lightning Fork, when installed (exports.sh). The command above turns
      # this off again unless the node is on the BLAKE2b chain and Lightning
      # Fork has a wallet. The paths are inside the mount below.
      LIGHTNING_ENABLED: $APP_MEMPOOL_PRUNED_LIGHTNING_FORK
      LIGHTNING_BACKEND: "lnd"
      LIGHTNING_STATS_REFRESH_INTERVAL: "3600"
      LIGHTNING_GRAPH_REFRESH_INTERVAL: "3600"
      LND_REST_API_URL: $APP_MEMPOOL_PRUNED_LND_REST_URL
      LND_TLS_CERT_PATH: "/lnd/tls.cert"
      LND_MACAROON_PATH: "/lnd/data/chain/bitcoin/mainnet/readonly.macaroon"
      LND_TIMEOUT: "120000"

      MAXMIND_ENABLED: "false"

      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      # Read-only, and only for the cookie, which is the sole thing needed from the
      # node itself: every block and transaction lookup goes through the proxy and
      # the Electrum server, not through this mount. Mounted at /bitcoin rather than
      # /backend, which is where the application itself lives.
      - ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro
      # Lightning Fork's lnd directory, read-only, when it is installed, for
      # its TLS certificate and read-only macaroon; an empty directory of this
      # app's own when it is not (see exports.sh).
      - ${APP_MEMPOOL_PRUNED_LND_DIR}:/lnd:ro
    depends_on:
      - db
    networks:
      default:
        ipv4_address: $APP_MEMPOOL_PRUNED_API_IP

  db:
    image: mariadb:10.5.21@sha256:dfcba5641bdbfd7cbf5b07eeed707e6a3672f46823695a0d3aba2e49bbd9b1dd
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "moneyprintergobrrr"
    volumes:
      - ${APP_DATA_DIR}/mysql/data:/var/lib/mysql
    networks:
      default:
        ipv4_address: $APP_MEMPOOL_PRUNED_DB_IP
