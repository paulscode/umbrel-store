releaseNotes: >-
  Shows the Lightning network from Lightning Fork, and makes the Lightning pages
  work on a pruned node.


  With Lightning Fork installed, the explorer's Lightning pages read its view
  of the network on the BLAKE2b chain, with nothing to set up. They stay off
  while this explorer's Bitcoin node is on the SHA256 chain, and until Lightning
  Fork has a wallet. If you install Lightning Fork after this app, restart this
  app once its wallet exists.


  The Lightning pages also left out every channel on a pruned node. To date and
  size a channel, the explorer looked up the transaction that opened it by its
  id, which only a node keeping a full transaction index can answer, and a
  pruned node cannot keep one. It now takes the capacity from the Lightning
  node and the date from the block header, which a pruned node keeps for every
  block.


