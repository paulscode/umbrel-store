manifestVersion: 1.1
id: paulscode-mempool-pruned
category: bitcoin
name: Mempool Pruned
version: "3.3.1.6"
tagline: A block explorer that works with a pruned Bitcoin node
description: >-
  Run your own mempool.space against a pruned node. The official Mempool app
  requires an archival node with transaction indexing, which means keeping the
  whole chain on disk. This one does not.


  HOW IT WORKS


  Mempool normally looks up a confirmed transaction by asking Bitcoin for it
  directly, which only works if the node keeps a transaction index, and that
  index cannot be built on a pruned node. This build asks the Electrum server
  instead. That server has its own index, and fetches any block your node has
  dropped from the peer-to-peer network, so the explorer sees a complete chain
  on a node that is not keeping one.


  REQUIREMENTS


  Install Electrs Pruned first and let it finish indexing. The official Electrs
  app will not do: it requires an archival node, which is the requirement this
  app exists to remove.


  Your Bitcoin Node may be pruned or archival. Nothing here asks you to change
  it either way.


  Umbrel asks which Bitcoin node to use when you install this. Pick the same one
  you picked for Electrs Pruned. This explorer reads its blocks through that app,
  so pointing the two at different nodes gives you an explorer describing a chain
  it is not reading. Either node works, including the BLAKE2b companion, as long
  as both apps agree.


  WHAT TO EXPECT


  Blocks below your node's prune height are fetched from the network on demand,
  so opening an old block page is slower than a recent one, and the page says so
  while it works. Recent history is unaffected. The explorer keeps its own
  database, which is separate from the chain and still needs room.


  Installs alongside the official Mempool and the BIP-110 fork. All three keep
  their own database, address and port, so you can run more than one.
