releaseNotes: >-
  Fixes the explorer falling behind the chain, and gives every block a miner name.

  The explorer worked out each transaction's fee by reading every input's previous transaction. On a pruned node those sit in blocks your node no longer keeps, so each one became a block fetch from a peer. One recent block needed 288 of them. That took longer than the time between blocks, so the explorer fell further behind with every block, eventually gave up and showed only the eight most recent, and stopped serving history. It now reads the whole block from your node in one call, which supplies the fees as well, and only falls back to the slower route for blocks your node has pruned. A block that took minutes now takes milliseconds. Nothing you have set changes, and the history already indexed is still there.

  Blocks whose miner is not in the known pool list now show the name the miner wrote into the block itself, rather than Unknown. A recognised pool still shows its own name and icon.

  The optional indexing features work on a pruned node for the first time. Block summaries, Goggles and CPFP indexing all read whole blocks, and they now stop where your node's blocks stop. A single block that cannot be read is skipped rather than restarting the whole backfill.
