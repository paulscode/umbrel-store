# Community stores must supply full URLs for icon and gallery — Umbrel's
# resolver only auto-prefixes URLs for the official `umbrel-app-store`.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-pickhash/icon.svg
gallery: []
path: ""
defaultUsername: ""
# The dashboard login is the Umbrel app password ($APP_PASSWORD, wired to
# DASHBOARD_PASSWORD in docker-compose.yml). deterministicPassword: true makes
# Umbrel surface that exact value under the tile's "Show default credentials",
# so Pickhash starts with a working password instead of an empty setup step.
defaultPassword: ""
deterministicPassword: true
releaseNotes: >-
  Each rented rig now runs at a share difficulty suited to its own size.


  MiningRigRentals scores a rental on the hashrate it measures, and it measures that from accepted
  shares. A rig left at a difficulty far above its own size produces too few shares to measure well,
  so a rental that really did deliver can read as underdelivering and a refund claim on it gets
  declined. Every rental used to be sent the same difficulty whatever its size: measured on the live
  market, the BLAKE2b rigs listed wanted difficulties from 873 to 20,955, which no single value serves.


  The difficulty comes from the rig's own published optimal range rather than from a calculation on its
  advertised hashrate, because that range is what the marketplace's own scoring expects, and that
  scoring is what decides a refund. It travels in the Stratum password, the only field a rental passes
  through to the pool untouched.


  Whether your endpoint honours the request is detected rather than assumed. The endpoint test now says
  which it is, and says so plainly when a gateway ignores it, in which case rentals behave exactly as
  they always did. Datum Gateway (BLAKE2b) Companion 1.0.10 honours it.
