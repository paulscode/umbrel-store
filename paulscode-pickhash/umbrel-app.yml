# resolver only auto-prefixes URLs for the official `umbrel-app-store`.
icon: https://raw.githubusercontent.com/paulscode/umbrel-store/master/paulscode-pickhash/icon.svg
gallery: []
path: ""
defaultUsername: ""
# The dashboard login is the Umbrel app password ($APP_PASSWORD, wired to
# DASHBOARD_PASSWORD in docker-compose.yml). deterministicPassword: true makes
# Umbrel surface that exact value under the tile's "Show default credentials",
# so Pickhash starts with a working password instead of an empty setup step.
defaultPassword: ""
deterministicPassword: true
releaseNotes: >-
  Adds BLAKE2b. Pickhash can now rent either SHA256 AsicBoost or Blake2B hashrate, chosen in Settings or during setup, so it works against a BLAKE2b node as well as a Bitcoin one.

  The two markets are kept apart. Prices, available hashrate, spend ceilings, your saved endpoint, the display unit and which HashGG the endpoint comes from are all per algorithm, because a TH of BLAKE2b costs roughly 5,400 times a TH of SHA256 on a market a million times smaller. A limit set for one means nothing for the other, so nothing is shared and nothing is mixed into one chart or one total.

  Which algorithm is active is shown in the header on every screen, and again on both screens that spend, so a rental cannot be confirmed without it being visible. Switching is refused while a session is running, since the rentals already paid for on the other market would go unmanaged.

  Three things that would have quietly cost money on BLAKE2b are fixed. The protective per-rig price cap sent to MiningRigRentals was always expressed per PH, which on a market quoted per TH would have been a thousand times higher than intended. The Ocean fallback pool is SHA256 only and defaulted to on; it is now unavailable on BLAKE2b rather than failing hashrate over to a pool that cannot mine it. And the endpoint test only checked the username you typed, not the one rentals actually send, so a stratum server that accepted one and refused the other passed setup and failed every rental.

  Autopilot now says why it cannot cover a target rather than only how much it can, naming the rigs it passed over and the reason. It also no longer rejects a rig for a reason the rig cannot escape: an unrented rig reports no hashrate, which was read as wild instability rather than as nothing measured yet, so on a young market every rig was refused forever. Whether to rent rigs with no delivery history is now a setting, on by default for BLAKE2b and off for SHA256.

  Existing installs are unaffected. Everything already recorded is labelled SHA256 AsicBoost, which is what it was, and no re-index is needed.
